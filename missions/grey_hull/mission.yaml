# Operation GREY HULL: Harpoon strike from the carrier. Source of truth; `python -m dcsmb build` renders hangar/grey_hull/.
#
# Story device: deception. A surface action group has sortied from Novorossiysk and is hiding among
# merchant traffic. There are two radar contacts and only one of them is warships. The E-2C's ESM read
# says which, but a third of the time red has put a decoy emitter on the merchants and the read is
# wrong. Look before you shoot: a Harpoon goes for the first ship it finds.
#
# Sea positions checked against the OSM coastline (every ship point 14+ km offshore, south of the coast).

meta:
  id: grey_hull
  title: "Operation GREY HULL"
  subtitle: "Harpoon Strike off Gelendzhik"
  theater: caucasus
  date: 2026-03-26
  start_time: "06:50"
  weather:
    temperature_c: 9
    wind_from_deg: 300
    wind_kts: 16
    clouds: "Broken 2,500 ft, overcast 9,000 ft"
    visibility: "8 km in drizzle, lower in showers"
    qnh_inhg: 29.82
  blue_country: USA
  red_country: Russia

narrative:
  operation: "GREY HULL"
  backstory: |
    After the Backfire raid, the Black Sea Fleet stopped sending bombers and started sending
    ships. Last night a surface action group left Novorossiysk under cover of the weather: a
    Krivak-class frigate and a Grisha corvette, heading southeast to put SA-N-4s and a towed
    sonar between the Stennis and the coast.

    They know about the Hawkeye, so they're hiding in the shipping lanes. At 0500 the E-2C
    had two surface groups 25 miles apart off Gelendzhik, each about the size of a frigate
    and a corvette. One is the warships and the other is merchants bound for Novorossiysk.
    Springfield flight has four Harpoons and has to work out which is which.
  characters:
    - name: "Cmdr. Ray \"BISHOP\" Ortega"
      role: "CAG, Carrier Air Wing aboard USS John C. Stennis"
    - name: "Lt. Hana \"PRISM\" Okafor"
      role: "Strike group intelligence officer; owns the ESM read on the two contacts"
    - name: "DARKSTAR"
      role: "E-2C Hawkeye, holding northwest of the boat"
    - name: "TEXACO 1"
      role: "S-3B tanker overhead the carrier"
    - name: "Springfield 1-1 / 1-2"
      role: "You and your wingman, F/A-18C Hornets with Harpoon"
  hook: |
    "Two contacts, two ships each, and one of them is full of grain. I'd love to tell you which.
    Darkstar's going to tell you instead, and you're going to check." PRISM, 0600 brief
  outcomes:
    success: |
      The Krivak is burning and dead in the water and the Grisha is picking up her crew. The
      merchants never knew you were there. The fleet keeps its distance from the coast after
      this, and BISHOP gets his strike group's eastern flank back.
    partial: |
      The warships are hit, but a Harpoon also found a bulk carrier. Nobody aboard died. It's on
      Russian TV by lunch, and the admiral now wants a visual ID before every anti-ship shot,
      which means getting inside SA-N-4 range next time.
    failure: |
      The surface group slips south into the weather untouched. By tomorrow it will be sitting
      on the Stennis's approach to the coast. The strike group pulls back 60 miles, and Sukhumi
      loses an hour of fighter cover every day.

situation: |
  A red surface action group (one Krivak frigate and one Grisha corvette) sortied from
  Novorossiysk overnight and is somewhere in the shipping lanes off Gelendzhik. DARKSTAR holds two
  surface contacts of similar size about 25 nm apart: ALPHA to the north and BRAVO to the southeast.
  One is the warships, the other is merchant traffic. Both have SA-N-4 class air defence if
  they're warships. The weather is low and wet, so expect to find them by radar and ESM, not by eye.
  Krymsk has Su-27s that have flown over the fleet before. The Stennis is 100 nm southeast,
  steaming northwest into the wind.

objectives:
  primary: "Disable the surface action group (at least half the group's damage)."
  secondary: "Do not hit merchant shipping."
  tertiary: "Recover both aircraft aboard the Stennis."

roe: |
  Weapons free on the warships once you've identified them by ESM, radar or sight. Weapons
  hold on any contact you can't identify. A Harpoon will hit the first ship its seeker finds:
  don't launch it through a merchant. Weapons free on red aircraft that DARKSTAR declares
  hostile.

threats:
  - name: "Contact ALPHA"
    kind: sam
    intel: suspected
    lat: 44.2500
    lon: 38.3000
    area_km: 8
    range_km: 15
    notes: "Two ships, frigate and corvette sized, 6 knots southeast. If it's the SAG, SA-N-4 (Osa-M) out to about 15 km."
  - name: "Contact BRAVO"
    kind: sam
    intel: suspected
    lat: 44.0500
    lon: 38.7500
    area_km: 8
    range_km: 15
    notes: "Two ships, similar size, 8 knots. Same rule: treat it as SA-N-4 until you know it's a merchant."
  - name: "Su-27 Flankers (Krymsk)"
    kind: air
    intel: possible
    lat: 44.5500
    lon: 38.3000
    area_km: 30
    range_km: 0
    notes: "Flew cover over the fleet twice last week. DARKSTAR will call them if they come."

comms:
  # F/A-18C: radio 1 = COMM1, radio 2 = COMM2. Radio 1 channel 1 is always the flight frequency.
  - { name: "Springfield (inter-flight)", freq: "256.000 AM", radio: 1, channel: 1 }
  - { name: "DARKSTAR (E-2C)", freq: "251.000 AM", radio: 1, channel: 2, notes: "Answers the F5 AWACS menu" }
  - { name: "TEXACO 1 (S-3B)", freq: "253.000 AM", radio: 1, channel: 3, notes: "TACAN 60Y" }
  - { name: "Mother (Stennis)", freq: "127.500 AM", radio: 2, channel: 1, notes: "TACAN 74X, ICLS 1. Answers the ATC menu" }
  - { name: "BISHOP, PRISM", freq: "256.000 AM", notes: "Scripted calls (on-screen text); they don't answer the radio menu" }

