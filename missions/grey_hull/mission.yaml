target:
  name: "Red surface action group"
  lat: 44.1500
  lon: 38.5200
  area_km: 30
  groups: ["SAG Alpha", "SAG Bravo"]   # only the pair that was rolled counts
  kill_pct: 50
  description: "Krivak-class frigate and Grisha-class corvette, in one of the two contacts off Gelendzhik. Half the group's damage disables it."
  dmpi: "The frigate first: it carries the towed sonar and the bigger radar. Two Harpoons per ship, from different bearings if you can."

