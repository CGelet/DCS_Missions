      - { name: "TRANSIT", lat: 43.3000, lon: 39.0000, alt_ft: 28000, kts: 420, eta: "07:15" }
      - { name: "DESCEND", lat: 43.4500, lon: 38.7500, alt_ft: 28000, kts: 420, eta: "07:19", zone_km: 15 }
      - { name: "LOW",     lat: 43.5500, lon: 38.6500, alt_ft: 500,   kts: 450, eta: "07:22" }
      - { name: "HOOK",    lat: 43.6500, lon: 38.5500, alt_ft: 500,   kts: 450, eta: "07:24", action: antiship, zone_km: 10 }
      - { name: "OFF",     lat: 43.4500, lon: 38.3000, alt_ft: 500,   kts: 480, eta: "07:28" }
      - { name: "CLIMB",   lat: 43.2500, lon: 38.5500, alt_ft: 25000, kts: 400, eta: "07:33" }
      - { name: "MARSHAL", lat: 43.1500, lon: 38.9000, alt_ft: 6000,  kts: 300, eta: "07:45", zone_km: 15 }
