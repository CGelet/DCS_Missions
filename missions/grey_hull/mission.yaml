variants:
  - name: "The real contact"
    flag: 310
    options:
      - label: "Warships at ALPHA; the ESM read says ALPHA (true)"
        activate: ["SAG Alpha", "Merchants Bravo"]
        set_flag: 51
      - label: "Warships at BRAVO; the ESM read says BRAVO (true)"
        activate: ["SAG Bravo", "Merchants Alpha"]
        set_flag: 50
      - label: "Warships at BRAVO; a decoy emitter on the ALPHA merchants makes the read say ALPHA (false)"
        activate: ["SAG Bravo", "Merchants Alpha"]
        set_flag: 50

storyboard:
  - phase: "Cat Shot"
    time: "06:50"
    waypoints: []
    brief: |
      Cold start on the Stennis and launch into the wind. Low cloud and drizzle: it's an
      instrument departure. Mother is steaming 300 at 22 knots, toward the target.
    script: "BISHOP sends the flight off. Both pairs of ships spawn at mission start, per the roll."
    trigger:
      when: { time_after: 15 }
      message: "BISHOP: Springfield, CAG. Two contacts, one target. Don't let anyone rush you into the wrong one."
      seconds: 15

  - phase: "Top Off"
    time: "07:08"
    waypoints: ["TEXACO"]
    brief: |
      Join Texaco 1 overhead Mother at 8,000 ft (TACAN 60Y) and top off. Four Harpoons is
      a heavy jet, and the low-level leg burns gas fast.
    script: "Texaco is where briefed."
    trigger:
      when: { player_in_zone: "TEXACO" }
      message: "TEXACO 1: Springfield, Texaco, you're cleared pre-contact, basket's out."
      seconds: 15

  - phase: "Transit"
    time: "07:15"
    waypoints: ["TRANSIT", "DESCEND"]
    notes: "Ask the room: how much do you trust a single ESM read? What would make you trust it more?"
    brief: |
      Climb to 28,000 ft over the weather and head northwest. Before you descend, DARKSTAR
      will pass PRISM's ESM read on which contact is radiating warship radars. Treat it as
      a lead, not a fact.
    script: |
      At DESCEND, DARKSTAR passes the ESM read: it's right in two of the three rolls. 50%:
      two Su-27s from Krymsk sweep south over the contacts.
    triggers:
      - when: { player_in_zone: "DESCEND", variant: ["The real contact", 1] }
        message: "DARKSTAR: Springfield, Darkstar. ESM has naval search radar on contact ALPHA, the northern group. Moderate confidence."
        seconds: 25
      - when: { player_in_zone: "DESCEND", variant: ["The real contact", 2] }
        message: "DARKSTAR: Springfield, Darkstar. ESM has naval search radar on contact BRAVO, the southeastern group. Moderate confidence."
        seconds: 25
      - when: { player_in_zone: "DESCEND", variant: ["The real contact", 3] }
        message: "DARKSTAR: Springfield, Darkstar. ESM has naval search radar on contact ALPHA, the northern group. Moderate confidence."
        seconds: 25
      - when: { player_in_zone: "DESCEND" }
        chance: 50
        activate: ["Krymsk Flankers"]
        message: "DARKSTAR: Springfield, new group, two fast movers, Krymsk, heading south toward the contacts. Hostile."
        seconds: 20

  - phase: "Under the Radar"
    time: "07:22"
    waypoints: ["LOW", "HOOK"]
    brief: |
      Drop to 500 ft below the cloud and run in under the ships' radar horizon. From HOOK
      both contacts are inside Harpoon range and outside SA-N-4 range. Use your radar, RWR
      and ATFLIR to confirm which one is the warships before you commit.
    script: |
      The RWR should pick up the warships' radars from HOOK. A decoy emitter isn't modelled,
      so the RWR tells the truth even when DARKSTAR doesn't. The AI wingman only engages armed ships.
    trigger:
      when: { player_in_zone: "HOOK" }
      message: "DARKSTAR: Springfield, Darkstar. You're at the hook. Your call, your shot."
      seconds: 15

  - phase: "Launch and Leave"
    time: "07:24"
    waypoints: ["OFF"]
    brief: |
      Launch from HOOK with a seeker path that doesn't cross the other contact, then turn
      southwest and stay low until OFF. Don't go and look at the damage.
    script: "The story branches: the SAG is disabled, a merchant is hit, or both."
    triggers:
      - when: { target_destroyed: true }
        message: "DARKSTAR: Springfield, Darkstar. Strong secondaries on the warship group, it's dead in the water. Good shooting."
        set_flag: 10
        seconds: 20
      - when: { group_life_below: ["Merchants Alpha", 95], flag: 50 }
        message: "DARKSTAR: Springfield, Darkstar. Explosion on the northern contact. That's the merchant group. Check your fire."
        set_flag: 20
        seconds: 20
      - when: { group_life_below: ["Merchants Bravo", 95], flag: 51 }
        message: "DARKSTAR: Springfield, Darkstar. Explosion on the southeastern contact. That's the merchant group. Check your fire."
        set_flag: 20
        seconds: 20

  - phase: "Recovery"
    time: "07:45"
    waypoints: ["CLIMB", "MARSHAL"]
    brief: |
      Climb back over the weather and recover aboard Mother: TACAN 74X, ICLS 1. Expect Case
      III: the cloud is low. Texaco is overhead if you need gas.
    script: "BISHOP calls it when the flight reaches marshal."
    triggers:
      - when: { player_in_zone: "MARSHAL", flag: 10, flag_false: 20 }
        message: "BISHOP: Springfield, CAG. Right ship, right shot. Come aboard."
        seconds: 20
      - when: { player_in_zone: "MARSHAL", flag: 20 }
        message: "BISHOP: Springfield, CAG. Come aboard. We'll talk about the merchant in the ready room."
        seconds: 20
