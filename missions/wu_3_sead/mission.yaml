      - { name: "SHOT 1",     lat: 41.6100, lon: 45.2200, alt_ft: 24000, kts: 450, eta: "10:23", action: sead, zone_km: 3, timing: { from: "SPARTAN IP", seconds: 35, window_s: 20, flag: 61 } }
      - { name: "SHOT 2",     lat: 41.6650, lon: 45.3100, alt_ft: 22000, kts: 450, eta: "10:26", action: sead, zone_km: 3, timing: { from: "SPARTAN IP", seconds: 180, window_s: 20, flag: 62 } }
      - { name: "EGRESS",     lat: 41.7000, lon: 45.1000, alt_ft: 20000, kts: 400, eta: "10:30", zone_km: 4 }
