storyboard:
  - phase: "Start and Transit"
    time: "10:00"
    waypoints: []
    brief: |
      Cold start at Vaziani. Load both emitters as pre-planned HARM targets before you taxi. Depart
      east and climb to 24,000 ft for SPARTAN IP.
    script: "WREN checks in from the range cabin."
    trigger:
      when: { time_after: 10 }
      message: "WREN: Dodge one, Wren at Spartan. Radars are warming up. They'll be looking at you before the IP."
      seconds: 15

  - phase: "Shot 1: SA-6 Radar"
    time: "10:22"
    waypoints: ["SPARTAN IP", "SHOT 1"]
    notes: "Have the student call out the RWR picture at the IP before you show the tape."
    brief: |
      Check in at SPARTAN IP. Range control clears the range hot. SHOT 1 is 35 s from the IP. Fire the
      first HARM at the SA-6 radar, and turn away west while it flies.
    script: "SPARTAN clears the range hot at the IP (flag 50). The SA-6 radar dying sets flag 11."
    triggers:
      - when: { player_in_zone: "SPARTAN IP" }
        set_flag: 50
        message: "SPARTAN: Dodge one, Spartan. Range is hot. Cleared SA-6 radar and SA-8. Launchers are not cleared."
        seconds: 20
      - when: { group_dead: "SPARTAN Radar", flag: 50 }
        set_flag: 11
        message: "SPARTAN: Direct hit on the SA-6 radar. It's off the air. Dodge one, continue to Shot 2."
        seconds: 15

  - phase: "Shot 2: SA-8"
    time: "10:26"
    waypoints: ["SHOT 2"]
    brief: |
      SHOT 2 is 3 minutes from the IP: turn away after Shot 1, then come back round to it. Fire the second HARM at the SA-8 and turn away. Don't
      close inside 10 km of it to make the shot.
    script: "The SA-8 dying after the SA-6 radar completes the event (flag 10). Any launcher hit is a foul (flag 22)."
    triggers:
      - when: { group_dead: "SPARTAN Osa", flag: 11 }
        set_flag: 10
        message: "SPARTAN: SA-8 destroyed. Both emitters down. Range is cold. Dodge one, cleared off to the west."
        seconds: 15
      - when: { group_life_below: ["SPARTAN Launchers", 100] }
        set_flag: 22
        message: "SPARTAN: Dodge one, you hit a launcher. That's a range foul. Range is cold, master arm safe."
        seconds: 20
      - when: { player_below_agl_ft: 5000, player_in_zone: "RANGE", flag: 50 }
        set_flag: 23
        message: "SPARTAN: Dodge one, below the range floor. Climb, climb."
        seconds: 15

  - phase: "Recovery"
    time: "10:30"
    waypoints: ["EGRESS"]
    brief: |
      Off the range to the west via EGRESS, master arm SAFE, and recover to Vaziani.
    script: "WREN's closing call."
    trigger:
      when: { player_in_zone: "EGRESS", flag: 50 }
      message: "WREN: Dodge one, Wren. Off the range. Bring me the RWR tape, I want to hear it."
      seconds: 15
