# WORK-UPS event 3: SEAD fundamentals. Source of truth; `python -m dcsmb build` renders hangar/wu_3_sead/.
#
# Training: nothing hidden or random. A live-emitting but weapons-hold SA-6 and SA-8 on the steppe east
# of the Gareja range. Two timed HARM shot points (EARLY / ON TIME / LATE from the IP). Only the radars
# are cleared: killing an SA-6 launcher is a range foul. Both radars dead completes the event.
# Site on open steppe in Sagarejo district, 12 km NE of David Gareja and clear of settlements (OSM).

meta:
  id: wu_3_sead
  title: "LOUD NEIGHBOURS"
  subtitle: "SEAD Fundamentals"
  category: training
  theater: caucasus
  role: "SEAD"
  date: 2026-01-20
  start_time: "10:00"
  weather:
    temperature_c: 1
    wind_from_deg: 290
    wind_kts: 12
    clouds: "Clear"
    visibility: "40 km"
    qnh_inhg: 30.10
  blue_country: USA
  red_country: Russia

training:
  syllabus: "Det work-ups, event SEAD-1"
  rules:
    - "The range emitters are live radars on weapons hold. They will lock you; they will not fire. Treat every lock as real in your tactics."
    - "Cleared targets: the SA-6 search-and-track radar and the SA-8. The SA-6 launchers are not cleared: hitting one is a range foul."
    - "Shot 1 (SA-6 radar) from SHOT 1, Shot 2 (SA-8) from SHOT 2. Each point has a ±20 s window from the IP."
    - "Altitude block 20,000 to 26,000 ft until both shots are off. Nothing below 5,000 ft AGL on the range at any time."
    - "Range boundary: the Azerbaijan border, 10 km east of the site. Turn away from it after every shot."
    - "Bingo 4,000 lb to Vaziani."
  knock_it_off: |
    Anyone can call "Knock it off" for a border infringement, an altitude bust or a hung missile.
    Turn west, climb to 26,000 ft, master arm SAFE, and wait for SPARTAN to call the range hot again.
  special_subjects:
    - "Range-known versus self-protect HARM modes: why we brief a pre-planned shot and still carry the TOO page."
    - "What the RWR shows when the SA-6 goes from search to track. Hear it, call it, then shoot."
    - "HARM time of flight from 40 km: about 75 s. What do you do with that time?"
    - "The SA-8 on its own: it's short range and mobile. Don't fly inside 10 km of it to make the shot."
  grade_sheet:
    - { item: "Range check-in", standard: "Checks in at SPARTAN IP at 24,000 ft and confirms the cleared emitters." }
    - { item: "Shot 1 timing", standard: "Reaches SHOT 1 within ±20 s of plan from the IP." }
    - { item: "Shot 1 result", standard: "The SA-6 search-and-track radar is destroyed." }
    - { item: "Shot 2 timing", standard: "Reaches SHOT 2 within ±20 s of plan from the IP." }
    - { item: "Shot 2 result", standard: "The SA-8 is destroyed." }
    - { item: "Range discipline", standard: "No launcher hits, no border infringement, nothing below 5,000 ft AGL." }
  debrief_focus:
    - "RWR tape: when did each emitter lock you, and what did you do?"
    - "HARM shot range, mode and time of flight against the plan."
    - "Where the jet was pointing during each missile's time of flight."

narrative:
  operation: "LOUD NEIGHBOURS"
  backstory: |
    The Georgian Air Defence Command keeps a captured SA-6 battery and an SA-8 on the steppe east of
    the Gareja range for exactly this: letting allied crews hear a real Soviet-era radar on the RWR
    and shoot it. Today they've agreed to let the detachment put two live HARMs into the old radars.
    The launchers stay; the radars were due to be scrapped anyway.

    You'll get one pass at each emitter, on a timeline. The radars will lock you the whole time.
    They won't fire. What's graded is whether you shoot on time, at the right thing, and turn away
    like it was real.
  characters:
    - name: "LCDR Ana \"WREN\" Castellano"
      role: "Detachment training officer, grading from the range control cabin"
    - name: "Maj. Nino Tsereteli"
      role: "Georgian Air Defence Command: SPARTAN range control"
    - name: "Dodge 1"
      role: "You, single-ship F/A-18C with two HARMs"
  hook: |
    "Those radars have been looking at people like you for forty years. Today you get to answer
    back. Twice. On time." WREN, SEAD brief
  outcomes:
    success: |
      Complete. Both radars are smoking holes, both shots were on time, and the launchers are
      untouched. WREN signs SEAD-1 and the range officer asks for a copy of your tape.
    partial: |
      Partial: re-fly items. One emitter is still radiating, or a shot was outside its window. You'll
      re-fly the missed shot on the next range day.
    failure: |
      Incomplete: re-fly the event. A launcher hit or a border infringement closed the range. The
      re-fly comes after a sit-down with WREN and SPARTAN.

situation: |
  Single ship from Vaziani to the SPARTAN emitter site, 50 km east, on the steppe 12 km northeast
  of David Gareja. The SA-6 radar and three launchers sit in a revetted battery position; the SA-8
  is 4 km northwest of it. Both radiate and lock but are on weapons hold. Check in at SPARTAN IP,
  then fly to SHOT 1 and SHOT 2 on the timeline, firing one HARM at each cleared radar. The
  Azerbaijan border is 10 km east of the site.

objectives:
  primary: "Destroy the SA-6 radar and the SA-8 with one HARM each."
  secondary: "Reach both shot points within ±20 s of plan."
  tertiary: "No launcher hits and no border infringement."

roe: |
  HARMs at the SA-6 radar and the SA-8 only. Master arm SAFE outside the range. No weapons release
  east of the SHOT points.

threats:
  - name: "SPARTAN SA-6 battery (radar cleared, launchers not)"
    kind: sam
    lat: 41.5300
    lon: 45.4900
    range_km: 24
    notes: "1S91 search-and-track radar and three 2P25 launchers. Live radar, weapons hold. Only the radar is cleared."
  - name: "SPARTAN SA-8 (cleared)"
    kind: sam
    lat: 41.5550
    lon: 45.4550
    range_km: 10
    notes: "9A33 Osa, radar and missiles on one vehicle. Live radar, weapons hold."
  - name: "Azerbaijan border"
    kind: hazard
    lat: 41.5200
    lon: 45.6100
    range_km: 3
    notes: "Range boundary. Turn west after every shot."
  - name: "David Gareja monastery: no-fly"
    kind: hazard
    lat: 41.4472
    lon: 45.3766
    range_km: 5
    notes: "Same rule as on the Gareja range: no overflight within 5 km."

comms:
  # F/A-18C: radio 1 = COMM1, radio 2 = COMM2. Radio 1 channel 1 is always the flight frequency.
  - { name: "Dodge (det common)", freq: "254.000 AM", radio: 1, channel: 1, notes: "WREN monitors here" }
  - { name: "SPARTAN range control", freq: "252.500 AM", radio: 1, channel: 2, notes: "Clears the range hot or cold" }
  - { name: "Vaziani Tower", freq: "140.000 AM", radio: 2, channel: 1, notes: "TACAN 22X" }
  - { name: "SPARTAN, WREN", freq: "252.500 AM", notes: "Scripted calls (on-screen text); they don't answer the radio menu" }

