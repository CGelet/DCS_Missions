      - { name: "OUT",      lat: 42.3000, lon: 40.8000, alt_ft: 20000, kts: 450, eta: "10:48", zone_km: 6 }
    land: "Stennis Group"

target:
  name: "SA-10 track radar"
  lat: 42.7300
  lon: 41.5800
  area_km: 8
  groups: ["Flap Lid North", "Flap Lid East"]
  description: "The 30N6 (Flap Lid) track-and-engagement radar on its mast, beside the battery's launchers. Without it, nothing fires."
  dmpi: "HARM in pre-briefed mode against the RIVET position, or self-protect mode when it locks the TALDs."

