variants:
  - name: "Battery site"
    options:
      - label: "North, on the hill above the Tkvarcheli road"
        activate: ["Flap Lid North", "Battery North"]
        when: { player_in_zone: "LAUNCH" }
        message: "RIVET: Springfield, Rivet. Big Bird search radar up, bearing from LAUNCH zero-seven-five. North site. It's looking at your decoys."
        seconds: 20
      - label: "East, on the ridge toward Gali"
        activate: ["Flap Lid East", "Battery East"]
        when: { player_in_zone: "LAUNCH" }
        message: "RIVET: Springfield, Rivet. Big Bird search radar up, bearing from LAUNCH zero-eight-five. East site. It's looking at your decoys."
        seconds: 20

storyboard:
  - phase: "Launch"
    time: "10:15"
    waypoints: ["LOW"]
    brief: |
      Cold start on the Stennis. Launch and go straight down to 500 ft over the water heading north.
      Below the S-300's horizon until you pop.
    script: "MERLIN checks in. The battery site is chosen at LAUNCH. 50%: a Tor guards it."
    triggers:
      - when: { time_after: 10 }
        message: "MERLIN: Springfield, Merlin. Stay low until LAUNCH. Make it look at the decoys, not at you."
        seconds: 15
      - when: { time_after: 5 }
        chance: 50
        activate: ["Battery Tor"]

  - phase: "Pop and Decoy"
    time: "10:40"
    waypoints: ["LAUNCH"]
    notes: "Ask the room: the decoys are away and RIVET hasn't called. How long do you wait before the HARMs?"
    brief: |
      Pop to 20,000 ft at LAUNCH and release all six TALDs toward the harbour. RIVET will call the
      search radar the moment it lights up. That tells you which site.
    script: "The rolled site spawns at LAUNCH with RIVET's call (see variants)."
    trigger:
      when: { player_in_zone: "LAUNCH" }
      message: "DARKSTAR: Springfield, Darkstar. Picture clean. Gudauta's quiet."
      seconds: 10

  - phase: "Shoot"
    time: "10:42"
    waypoints: ["SHOOT"]
    brief: |
      Turn toward SHOOT and fire both HARMs at the track radar while it's busy with the decoys. Then
      turn hard west and dive for the water.
    script: "Track radar destroyed: success (flag 10)."
    trigger:
      when: { target_destroyed: true }
      set_flag: 10
      message: "RIVET: Springfield, Rivet. Flap Lid's off the air. It's not coming back. The battery's blind."
      seconds: 20

  - phase: "Home"
    time: "10:48"
    waypoints: ["OUT"]
    brief: |
      Out to sea, climb, and recover aboard the Stennis.
    script: "MERLIN's closing call."
    trigger:
      when: { player_in_zone: "OUT" }
      message: "MERLIN: Springfield, Merlin. Copy feet wet. Come home."
      seconds: 15
