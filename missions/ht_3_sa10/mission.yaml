# HIGH TIDE chapter 3: blind the SA-10. Source of truth; `python -m dcsmb build` renders hangar/ht_3_sa10/.
#
# Story device: make it look. The SA-10 won't radiate for a lone fighter it can see coming, so the
# plan is decoys: TALDs from 20,000 ft, HARMs into the track radar when it lights up for them. The
# sim rolls which of two hill sites the battery is using; 50% a Tor guards it. Low over the water,
# pop at LAUNCH. Success is the 30N6 (Flap Lid) track radar destroyed: the battery is blind without it.
# Both sites on high ground inland of Ochamchire, clear of the villages (OSM).

meta:
  id: ht_3_sa10
  title: "Operation HIGH TIDE"
  subtitle: "Blind the SA-10"
  theater: caucasus
  role: "SEAD"
  date: 2038-05-15
  start_time: "10:15"
  weather:
    temperature_c: 18
    wind_from_deg: 240
    wind_kts: 10
    clouds: "Scattered 5,000 ft"
    visibility: "25 km"
    qnh_inhg: 29.99
    cloud_preset: LightScattered1
    cloud_base_ft: 5000
  blue_country: USA
  red_country: Russia

narrative:
  operation: "HIGH TIDE"
  backstory: |
    Poti's channels are open. The night after the minelayers, a Georgian Su-25 looking at the coast
    north of Anaklia saw a missile come up from the hills behind Ochamchire, from 60 km away. It
    missed, barely. ELINT confirmed it within the hour: an SA-10, the long-range S-300, moved in to
    cover the harbour.

    Nothing gets near Ochamchire until it's blind. The S-300 is patient: it won't radiate for a
    lone jet it can see coming. So today, Springfield brings it something more interesting to look
    at: a sky full of decoys.
  characters:
    - name: "CAPT Lena \"MERLIN\" Ostrowski"
      role: "CAG, aboard the Stennis"
    - name: "LCDR Sam \"PRISM\" Haddad"
      role: "Strike group intelligence officer"
    - name: "RIVET"
      role: "Coalition ELINT aircraft"
    - name: "DARKSTAR"
      role: "E-2C Hawkeye"
    - name: "Springfield 1-1 / 1-2"
      role: "You and your wingman, F/A-18C Hornets with TALDs and HARMs"
  hook: |
    "It sees everything. That's the problem and the plan. Give it six targets that aren't there and
    watch it light up to find out which ones are." PRISM, SEAD brief
  outcomes:
    success: |
      The SA-10's track radar takes two HARMs and stops radiating for good. Without it, the battery is
      a field of very expensive launchers. The air over Ochamchire is open.
    partial: |
      The HARMs damage the battery but the track radar survives. It's off the air for a day while they
      repair it, and the strike group has to move fast.
    failure: |
      The battery never takes the bait, or it shoots down the decoys and the HARMs miss. Ochamchire
      stays out of reach, and the landing force keeps loading.

situation: |
  An SA-10 (S-300PS) battery is on high ground behind Ochamchire, covering the harbour and the coast
  out to 75 km. ELINT has it at one of two hill sites. It radiates only briefly. Fly low over the water
  to LAUNCH, pop to 20,000 ft, launch TALDs toward the harbour, and kill the track radar with HARMs
  when it lights up for them. Expect point defence at the battery.

objectives:
  primary: "Destroy the SA-10's track radar."
  secondary: "Launch the TALDs from LAUNCH so they arrive before you do."
  tertiary: "Recover both aircraft aboard the Stennis."

roe: |
  Weapons free on air defence systems in Abkhazia. No release over Ochamchire town. Don't cross the
  coast: everything is done from over the water.

threats:
  - name: "SA-10 battery (one of two sites)"
    kind: sam
    intel: confirmed
    lat: 42.7300
    lon: 41.5800
    area_km: 8
    range_km: 75
    notes: "S-300PS. Search, track radar, launchers. Engages out to 75 km, high and low. It radiates only when it has to."
  - name: "Point defence"
    kind: sam
    intel: possible
    lat: 42.7300
    lon: 41.5800
    area_km: 8
    range_km: 12
    notes: "S-300s usually come with a Tor. It can shoot down HARMs."
  - name: "Quay Osa"
    kind: sam
    intel: confirmed
    lat: 42.7180
    lon: 41.4720
    range_km: 10
    notes: "From Springfield's photo pass."

comms:
  # F/A-18C: radio 1 = COMM1, radio 2 = COMM2. Radio 1 channel 1 is always the flight frequency.
  - { name: "Springfield (inter-flight)", freq: "256.000 AM", radio: 1, channel: 1 }
  - { name: "DARKSTAR (E-2C)", freq: "251.000 AM", radio: 1, channel: 2, notes: "Answers the F5 AWACS menu" }
  - { name: "TEXACO 1 (S-3B)", freq: "253.000 AM", radio: 1, channel: 3, notes: "TACAN 60Y" }
  - { name: "Mother (Stennis)", freq: "127.500 AM", radio: 2, channel: 1, notes: "TACAN 74X, ICLS 1. Answers the ATC menu" }
  - { name: "RIVET, MERLIN, PRISM", freq: "256.000 AM", notes: "Scripted calls (on-screen text); they don't answer the radio menu" }

