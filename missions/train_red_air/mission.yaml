storyboard:
  - phase: "Start and Check-in"
    time: "14:00"
    waypoints: ["KILO ENTRY"]
    brief: |
      Cold start at Kobuleti, depart west over the water and climb to enter KILO. Check in with MAGIC
      on 251.0. Fence in at KILO ENTRY: master arm ON, lights off, chaff and flares set.
    script: "WREN checks in; MAGIC confirms the working area is clear at KILO ENTRY."
    triggers:
      - when: { time_after: 10 }
        message: "WREN: Enfield, Wren on det common. Aggressors are up out of Batumi. Hard deck five thousand, bubble one thousand."
        seconds: 15
      - when: { player_in_zone: "KILO ENTRY" }
        message: "MAGIC: Enfield two, Magic, radar contact. KILO is clear. Proceed to CAP, angels two-five."
        seconds: 15

  - phase: "Set 1: BVR Intercept"
    time: "14:19"
    waypoints: ["CAP"]
    notes: "Draw the timeline on the board: MiG's R-27 range, your AMRAAM range, and the turn-away point."
    brief: |
      At CAP, MAGIC starts set 1: Bandit 11, a MiG-29S, 60 km northwest at 25,000 ft, coming straight
      at you. Build the timeline, shoot outside its missile range, and don't merge.
    script: "Reaching CAP activates Bandit 11 and arms the hard-deck watch (flag 30). Bandit 11 dead sets flag 31."
    triggers:
      - when: { player_in_zone: "CAP" }
        activate: ["Bandit 11"]
        set_flag: 30
        message: "MAGIC: Enfield two, set one. Single group, three-one-zero, thirty-four miles, angels two-five, hot. Fight's on."
        seconds: 20
      - when: { group_dead: "Bandit 11" }
        set_flag: 31
        message: "MAGIC: Enfield two, splash Bandit one-one. Set one complete. Proceed to the BFM point for set two."
        seconds: 20
      - when: { player_below_ft: 5000, flag: 30, flag_false: 10 }
        set_flag: 21
        message: "WREN: Knock it off, knock it off! Enfield two, hard deck. Climb and acknowledge."
        seconds: 20

  - phase: "Set 2: 1v1 BFM"
    time: "14:28"
    waypoints: ["BFM"]
    brief: |
      At the BFM point, at 15,000 ft and 400 knots heading south, MAGIC starts set 2: Bandit 21, an
      F-5E, 11 km south, coming north for a head-on merge. Decide the first turn before the merge.
      Kill it in the first two turns or terminate.
    script: "Reaching BFM after set 1 activates Bandit 21 (flag 32). Bandit 21 dead sets flag 33."
    triggers:
      - when: { player_in_zone: "BFM", flag: 31 }
        activate: ["Bandit 21"]
        set_flag: 32
        message: "MAGIC: Enfield two, set two. Single F-5, south, six miles, angels one-five, head-on. Fight's on."
        seconds: 20
      - when: { group_dead: "Bandit 21" }
        set_flag: 33
        message: "WREN: Kill on Bandit two-one. Reset north, set three in sixty seconds. It's a one-versus-two."
        seconds: 20

  - phase: "Set 3: 1v2"
    time: "14:33"
    waypoints: []
    notes: "Ask: which F-5 do you kill first, and what do you do the moment you lose sight of the other one?"
    brief: |
      Sixty seconds after set 2, MAGIC starts set 3: Bandit 31, two F-5Es, 25 km west at 18,000 ft,
      heading east. Sort them, kill one, and keep sight of the other. If it goes bad, terminate and separate east.
    script: "60 s after flag 33, Bandit 31 activates (flag 34). Both dead completes the event (flag 10)."
    triggers:
      - when: { time_since_flag: [33, 60] }
        activate: ["Bandit 31"]
        set_flag: 34
        message: "MAGIC: Enfield two, set three. Two contacts, west, thirteen miles, angels one-eight, hot. Fight's on."
        seconds: 20
      - when: { group_dead: "Bandit 31" }
        set_flag: 10
        message: "MAGIC: Splash two F-5s. Enfield two, all sets complete. Knock it off, RTB Kobuleti."
        seconds: 20

  - phase: "Recovery"
    time: "14:45"
    waypoints: ["KILO EXIT"]
    brief: |
      Fence out at KILO EXIT: master arm SAFE. Recover to Kobuleti (tower 133.0). Fuel check
      at KILO EXIT. If you're at bingo during any set, knock it off and come straight here.
    script: "WREN's call depends on whether all three sets were finished without a hard-deck call."
    triggers:
      - when: { player_in_zone: "KILO EXIT", flag: 10, flag_false: 21 }
        message: "WREN: Enfield, Wren. Three sets, no hard deck. That's the phase. See you at the tapes."
        seconds: 15
      - when: { player_in_zone: "KILO EXIT", flag_false: 10 }
        message: "WREN: Enfield, Wren. We'll pick the rest up on Monday. Tapes at sixteen hundred."
        seconds: 15
