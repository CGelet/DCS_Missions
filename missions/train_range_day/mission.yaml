    lat: 41.4472
    lon: 45.3766
    range_km: 5
    notes: "Cultural heritage site. No overflight at any altitude within 5 km."

comms:
  # F/A-18C: radio 1 = COMM1, radio 2 = COMM2. Radio 1 channel 1 is always the flight frequency.
  - { name: "Dodge (det common)", freq: "254.000 AM", radio: 1, channel: 1, notes: "WREN monitors here" }
  - { name: "GAREJA RANGE control", freq: "251.500 AM", radio: 1, channel: 2, notes: "Clears each event hot or cold" }
  - { name: "Vaziani Tower", freq: "140.000 AM", radio: 2, channel: 1, notes: "UHF 269.000" }
  - { name: "Range control, WREN", freq: "251.500 AM", notes: "Scripted calls (on-screen text); they don't answer the radio menu" }

