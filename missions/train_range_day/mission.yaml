# Training event GAREJA RANGE: air-to-ground weapons qualification. Source of truth;
# `python -m dcsmb build` renders hangar/train_range_day/.
#
# Training, not combat: the targets are briefed exactly, nothing shoots back (hold fire), and
# nothing is random. Range control clears each event in order; hitting a target you weren't
# cleared on is a range foul. The range sits on empty steppe in Sagarejo district (no settlements
# on the range per OSM; nearest farmsteads are 2+ km away). David Gareja monastery, 14 km south,
# is a briefed no-fly area.

meta:
  id: train_range_day
  title: "GAREJA RANGE"
  subtitle: "Air-to-Ground Weapons Qualification"
  category: training
  theater: caucasus
  role: "Air-to-ground range"   # mission type: the hangar filters on it
  date: 2038-02-11
  start_time: "10:30"
  weather:
    temperature_c: 6
    wind_from_deg: 300
    wind_kts: 8
    clouds: "Clear"
    visibility: "30+ km"
    qnh_inhg: 30.05
  blue_country: USA
  red_country: Russia

training:
  syllabus: "Det work-ups, event SW-2"
  rules:
    - "Cleared hot only on the target range control calls. Hitting any other target is a range foul, and the range goes cold."
    - "Run-in heading 120 ±20° for every event. Left-hand pattern, with HOLD as the high key."
    - "Minimum release altitude 3,000 ft AGL for Mk-82s. Strafe foul line 2,000 ft slant range. The sim calls an abort below 150 ft AGL."
    - "No-fly area: 5 km around David Gareja monastery, 14 km south of the range. No overflight at any altitude."
    - "Laser code 1688. Lase only on the run-in heading."
    - "Bingo 3,500 lb to Vaziani. Vaziani is 25 km west: you'll get there."
  knock_it_off: |
    Range control or the pilot can call "Knock it off" for anything unsafe: a hung store, an
    altitude bust, a misidentified target or another aircraft in the pattern. Climb to HOLD altitude
    (15,000 ft), master arm SAFE, and wait for range control. "Range is cold" means master arm SAFE
    until you're cleared hot again.
  special_subjects:
    - "Hung bomb: jettison over the range impact area only, then go straight back to Vaziani."
    - "Target fixation on the strafe pass: recover by the foul line, whatever the bullets are doing."
    - "Self-lasing a GBU-12: start lasing at 10 seconds to impact and keep the spot on the tank."
    - "The wind: 300 at 8 kt is a crosswind on a 120 run-in. Where will the Mk-82s go?"
  grade_sheet:
    - { item: "Range check-in", standard: "Checks in at GAREJA IP with the correct call and the laser code confirmed." }
    - { item: "Event 1: GBU-12 on T-1", standard: "Destroys T-1 (2 tanks) using no more than 3 GBU-12, self-lased, from the briefed run-in." }
    - { item: "Event 2: Mk-82 CCIP on T-2", standard: "Destroys T-2 (3 trucks) with 4 Mk-82 or fewer, every release above 3,000 ft AGL." }
    - { item: "Event 3: Strafe T-3", standard: "Destroys T-3 (2 light vehicles) with the gun, recovering before the foul line on every pass." }
    - { item: "Range discipline", standard: "No range fouls. No releases while the range is cold." }
    - { item: "Safety", standard: "No minimum-altitude abort and no no-fly infringement." }
  debrief_focus:
    - "ATFLIR tape for every release: dive angle, release altitude, where the hits landed."
    - "Mk-82 misses against the wind correction."
    - "Pattern spacing and how long each pass took from high key to run-in."

narrative:
  operation: "GAREJA RANGE"
  backstory: |
    Two days after LONG VALLEY, the detachment moves its weapons work east. The Georgian Land Forces
    have lent the exercise a tactical range on the steppe near Udabno: open, flat and empty, with
    hulks and old trucks laid out as targets. It's the best range the detachment has flown on in
    a year.

    Today is a qualification. Three events in order, one pilot at a time: a laser-guided bomb on
    armour, unguided bombs on trucks, and the gun. Range control runs the pattern. Nothing out there
    shoots back. What's graded is accuracy and range discipline.
  characters:
    - name: "LCDR Ana \"WREN\" Castellano"
      role: "Detachment training officer, grading from the range tower"
    - name: "Capt. Levan Beridze"
      role: "Georgian Land Forces range officer: GAREJA RANGE control"
    - name: "Vaziani Tower"
      role: "Departure and recovery"
    - name: "Dodge 1"
      role: "You, single-ship F/A-18C on the qualification"
  hook: |
    "Three events, three targets, one pattern. I don't care how fast you go. I care that every
    bomb lands where you said it would." WREN, range brief
  outcomes:
    success: |
      Complete. All three targets are destroyed in order, with no fouls and no aborts. You're
      weapons-qualified for the exercise, and WREN signs the card on the range tower's roof.
    partial: |
      Partial: re-fly items. At least one event isn't finished, or a foul or abort happened along the
      way. You re-fly only the missed events on Friday's range period.
    failure: |
      Incomplete: re-fly the event. Either a range foul ended the period early, or the no-fly area
      was infringed. The re-fly comes with a sit-down with WREN and the range officer first.

situation: |
  Single-ship qualification on GAREJA RANGE, 25 km east of Vaziani. Check in at GAREJA IP at 15,000 ft.
  Range control clears the events in order: Event 1, GBU-12 on T-1 (two tank hulks). Event 2, Mk-82
  CCIP on T-2 (three trucks). Event 3, strafe on T-3 (two light vehicles). The run-in is from the
  northwest on heading 120. HOLD, to the east, is the high key for the pattern. The targets are
  inert hulks and don't shoot back. You're the only aircraft on the range for this period.

objectives:
  primary: "Destroy T-1, T-2 and T-3 in order, each with its briefed weapon, with no range fouls."
  secondary: "Every Mk-82 release above 3,000 ft AGL, and every strafe recovery before the foul line."
  tertiary: "No minimum-altitude abort and no no-fly infringement; return to Vaziani."

roe: |
  Live weapons on GAREJA RANGE only, on the target range control has cleared hot. Master arm SAFE
  outside the range and whenever the range is cold. No releases outside the impact area or across
  the no-fly area around David Gareja.

threats:
  # Training: the targets and hazards, exactly as they are
  - name: "T-1: two tank hulks (Event 1, GBU-12)"
    kind: armor
    lat: 41.5400
    lon: 45.3050
    range_km: 0
    notes: "Two T-55 hulks side by side, facing east. Laser code 1688."
  - name: "T-2: three trucks (Event 2, Mk-82 CCIP)"
    kind: armor
    lat: 41.5330
    lon: 45.3180
    range_km: 0
    notes: "Three Ural trucks in a line, 1.3 km southeast of T-1."
  - name: "T-3: two light vehicles (Event 3, strafe)"
    kind: armor
    lat: 41.5460
    lon: 45.3220
    range_km: 0
    notes: "Two UAZ jeeps, 1.4 km east-northeast of T-1. Strafe only."
  - name: "David Gareja monastery: no-fly"
