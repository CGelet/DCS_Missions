storyboard:
  - phase: "Start and Transit"
    time: "10:30"
    waypoints: []
    brief: |
      Cold start at Vaziani, single ship. Confirm laser code 1688 in the stores page before taxi.
      Depart east and climb to 15,000 ft for GAREJA IP.
    script: "WREN checks in from the range tower."
    trigger:
      when: { time_after: 10 }
      message: "WREN: Dodge, Wren in the range tower. Range is cold, targets are set. Check in at Gareja IP."
      seconds: 15

  - phase: "Event 1: GBU-12"
    time: "10:52"
    waypoints: ["GAREJA IP", "T-1"]
    notes: "Have the student talk through the lasing timeline and the run-in heading before you move on."
    brief: |
      Check in with GAREJA RANGE at the IP. Range control clears T-1 hot. Run in on heading 120,
      self-lase on 1688 and put one GBU-12 on each hulk. Climb back to HOLD between passes.
    script: "Range control clears T-1 at the IP (flag 50). T-1 destroyed sets flag 11 and clears T-2."
    triggers:
      - when: { player_in_zone: "GAREJA IP" }
        set_flag: 50
        message: "GAREJA RANGE: Dodge one, Gareja Range, radio check good. Range is hot. Cleared hot T-1, laser-guided, code one-six-eight-eight, run-in one-two-zero."
        seconds: 20
      - when: { group_dead: "T-1 Armor", flag: 50 }
        set_flag: 11
        message: "GAREJA RANGE: Shack! T-1 destroyed. Dodge one, cleared hot T-2, Mk-82, CCIP, minimum release three thousand."
        seconds: 20

  - phase: "Event 2: Mk-82 CCIP"
    time: "11:02"
    waypoints: ["HOLD"]
    brief: |
      From HOLD, roll in on T-2 on heading 120, in a 30° dive, releasing above 3,000 ft AGL. Two
      passes of two bombs. Allow for the crosswind.
    script: "T-2 destroyed after T-1 sets flag 12 and clears T-3. Destroying T-2 before it's cleared is a foul (flag 22)."
    triggers:
      - when: { group_dead: "T-2 Trucks", flag: 11 }
        set_flag: 12
        message: "GAREJA RANGE: Good hits, T-2 destroyed. Dodge one, cleared hot T-3, guns only. Watch the foul line."
        seconds: 20
      - when: { group_dead: "T-2 Trucks", flag_false: 11 }
        set_flag: 22
        message: "GAREJA RANGE: Dodge one, you were not cleared on T-2. Range foul. Range is cold, master arm safe, hold at HOLD."
        seconds: 20

  - phase: "Event 3: Strafe"
    time: "11:10"
    waypoints: []
    brief: |
      Strafe T-3 from a low-angle pattern, recovering by the 2,000 ft foul line. As many passes as you
      need, but every pass a safe one.
    script: |
      T-3 destroyed after T-2 completes the qualification (flag 10). Destroying T-3 early is a foul.
      Below 150 ft AGL anywhere on the range: abort call (flag 23).
    triggers:
      - when: { group_dead: "T-3 Strafe", flag: 12 }
        set_flag: 10
        message: "GAREJA RANGE: T-3 destroyed. That's all three events. Range is cold. Dodge one, cleared off the range, contact Vaziani."
        seconds: 20
      - when: { group_dead: "T-3 Strafe", flag_false: 12 }
        set_flag: 22
        message: "GAREJA RANGE: Dodge one, you were not cleared on T-3. Range foul. Range is cold, master arm safe."
        seconds: 20
      - when: { player_below_agl_ft: 150, flag: 50, flag_false: 10 }
        set_flag: 23
        message: "GAREJA RANGE: Abort, abort! Dodge one, below range minimum. Climb to HOLD altitude."
        seconds: 20

  - phase: "Recovery"
    time: "11:20"
    waypoints: ["EXIT"]
    brief: |
      Off the range to the northwest via EXIT, master arm SAFE, and recover to Vaziani (tower 140.0).
      Check for hung stores before you join the pattern.
    script: "WREN's closing call depends on whether the qualification finished clean."
    triggers:
      - when: { player_in_zone: "EXIT", flag: 10, flag_false: [22, 23] }
        message: "WREN: Dodge, Wren. Three for three, no fouls. Bring the tapes, that's a qual."
        seconds: 15
      - when: { player_in_zone: "EXIT", flag_false: 10 }
        message: "WREN: Dodge, Wren. Qual's not finished. We'll set up a re-fly for the missed events."
        seconds: 15
