storyboard:
  - phase: "Start and Transit"
    time: "08:40"
    waypoints: ["DESERT"]
    brief: |
      Cold start at Nellis. Before taxi, set laser code 1688 on the pod and both Maverick Es. Depart
      north, climbing to 18,000 ft, and route via DESERT to 61B IP.
    script: "WREN checks in from Blackjack's console."
    trigger:
      when: { time_after: 10 }
      message: "WREN: Chevy, Wren, at Blackjack. The movers are running. Check in at six-one-bravo IP."
      seconds: 15

  - phase: "Event 1: Maverick F"
    time: "09:12"
    waypoints: ["61B IP", "RANGE"]
    notes: "Ask the student how they told M-1 from M-2 on the IR picture before they locked."
    brief: |
      Check in with Blackjack at 61B IP. Blackjack clears M-1 hot. Find the trucks on the pod, run in
      along the valley, lock each engine block with the Maverick F and shoot. Climb back to HOLD between shots.
    script: "Blackjack clears M-1 at the IP (flag 50). M-1 destroyed sets flag 11 and clears M-2."
    triggers:
      - when: { player_in_zone: "61B IP" }
        set_flag: 50
        message: "BLACKJACK: Chevy one, Blackjack, range six-one-bravo is hot. Cleared hot M-1, two trucks northbound, Maverick Fox."
        seconds: 20
      - when: { group_dead: "M-1 Trucks", flag: 50 }
        set_flag: 11
        message: "BLACKJACK: M-1 destroyed. Chevy one, cleared hot M-2, two tracks southbound on the west side, Maverick Echo, code one-six-eight-eight."
        seconds: 20

  - phase: "Event 2: Maverick E"
    time: "09:20"
    waypoints: ["HOLD"]
    brief: |
      From HOLD, find M-2 on the west side of the valley. Area-track it on the ATFLIR, go to point track,
      fire the Maverick E and keep lasing until impact.
    script: "M-2 destroyed after M-1 sets flag 12 and clears M-3. Destroying M-2 early is a foul (flag 22)."
    triggers:
      - when: { group_dead: "M-2 Armor", flag: 11 }
        set_flag: 12
        message: "BLACKJACK: Good hits, M-2 destroyed. Chevy one, cleared hot M-3, two jeeps on the east side, guns only. They're quick."
        seconds: 20
      - when: { group_dead: "M-2 Armor", flag_false: 11 }
        set_flag: 22
        message: "BLACKJACK: Chevy one, you were not cleared on M-2. Range foul. Range is cold, master arm safe, hold at HOLD."
        seconds: 20

  - phase: "Event 3: Strafe"
    time: "09:30"
    waypoints: []
    brief: |
      Strafe M-3 in a shallow dive along the valley, leading the jeeps. Recover above 500 ft AGL on
      every pass. As many passes as it takes.
    script: |
      M-3 destroyed after M-2 completes the event (flag 10). Destroying M-3 early is a foul.
      Below 150 ft AGL after check-in: abort call (flag 23).
    triggers:
      - when: { group_dead: "M-3 Jeeps", flag: 12 }
        set_flag: 10
        message: "BLACKJACK: M-3 destroyed. That's all three. Range is cold. Chevy one, cleared off six-one-bravo, contact Nellis."
        seconds: 20
      - when: { group_dead: "M-3 Jeeps", flag_false: 12 }
        set_flag: 22
        message: "BLACKJACK: Chevy one, you were not cleared on M-3. Range foul. Range is cold, master arm safe."
        seconds: 20
      - when: { player_below_agl_ft: 150, flag: 50, flag_false: 10 }
        set_flag: 23
        message: "BLACKJACK: Abort, abort! Chevy one, below range minimum. Climb to HOLD altitude."
        seconds: 20

  - phase: "Recovery"
    time: "09:45"
    waypoints: ["EXIT"]
    brief: |
      Off the range southeast via EXIT, master arm SAFE, and recover to Nellis (TACAN 12X). Check for
      hung Mavericks before you join the pattern.
    script: "WREN's closing call depends on whether the event finished clean."
    triggers:
      - when: { player_in_zone: "EXIT", flag: 10, flag_false: [22, 23] }
        message: "WREN: Chevy, Wren. Three movers, no fouls. Bring the pod tape."
        seconds: 15
      - when: { player_in_zone: "EXIT", flag_false: 10 }
        message: "WREN: Chevy, Wren. Not finished. We'll put the missed events on Thursday."
        seconds: 15
