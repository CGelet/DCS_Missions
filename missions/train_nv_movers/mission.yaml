# Training event RANGE 61B: Mavericks and the gun against moving targets. Source of truth;
# `python -m dcsmb build` renders hangar/train_nv_movers/.
#
# Training, not combat: the targets are briefed exactly, nothing shoots back (hold fire), and nothing
# is random. New here: the targets move. Three groups drive off-road up and down the floor of Tikaboo
# Valley, which is NTTR Range 61B in OSM ("Contact Blackjack before proceeding"); Blackjack is Nellis
# range control. The valley floor is flat to within 40 m across 5 km (Open-Meteo), with no buildings
# or settlements within 3 km (Overpass). Groom Lake (R-4808N) is 30 km west: briefed no-fly. The
# Extraterrestrial Highway (NV-375, public) is 15 km north: no releases north of HOLD.

meta:
  id: train_nv_movers
  title: "RANGE 61B"
  subtitle: "Moving Targets"
  category: training
  theater: nevada
  role: "Air-to-ground range"
  date: 2037-12-07
  start_time: "08:40"
  weather:
    temperature_c: 4
    wind_from_deg: 200
    wind_kts: 10
    clouds: "Clear"
    visibility: "50+ km"
    qnh_inhg: 30.12
  blue_country: USA
  red_country: Russia

training:
  syllabus: "Nellis pre-deployment, event AG-4"
  rules:
    - "Cleared hot only on the group Blackjack calls. Hitting any other group is a range foul, and the range goes cold."
    - "Run in along the valley, north or south. No east-west run-ins: the targets drive north-south and you'll lose them."
    - "Minimum altitude 500 ft AGL on the range. The sim calls an abort below 150 ft AGL."
    - "No releases north of HOLD's latitude. The Extraterrestrial Highway, 15 km north, is a public road."
    - "No-fly: Groom Lake restricted area (R-4808N), 30 km west. No entry at any altitude."
    - "Laser code 1688 for the Maverick E. Check it matches in the pod and on the missile."
    - "Bingo 4,000 lb to Nellis."
  knock_it_off: |
    Blackjack or the pilot can call "Knock it off" for anything unsafe: a hung missile, an altitude bust,
    losing sight of the range boundaries or a misidentified group. Climb to HOLD altitude (15,000 ft),
    master arm SAFE, and wait for Blackjack. "Range is cold" means master arm SAFE until cleared hot again.
  special_subjects:
    - "Maverick F (IR) lock on a moving truck: the seeker tracks heat, so lock the engine, not the cargo bed."
    - "Maverick E (laser): the pod must track the mover. Use the ATFLIR's area track, then point track, before you fire."
    - "Strafing a mover: lead it. At 450 kt and 30 mph the jeep moves 15 m during the bullets' flight."
    - "Dust: the convoys raise dust on the lake bed. It hides them from the pod and shows them to your eyes."
  grade_sheet:
    - { item: "Range check-in", standard: "Checks in at 61B IP with the correct call and the laser code confirmed." }
    - { item: "Event 1: Maverick F on M-1", standard: "Destroys M-1 (2 trucks) with 2 AGM-65F or fewer." }
    - { item: "Event 2: Maverick E on M-2", standard: "Destroys M-2 (2 BMPs) with 2 AGM-65E or fewer, self-lased on 1688." }
    - { item: "Event 3: Strafe M-3", standard: "Destroys M-3 (2 jeeps) with the gun, recovering above 500 ft AGL on every pass." }
    - { item: "Range discipline", standard: "No range fouls. No releases while the range is cold or north of HOLD." }
    - { item: "Safety", standard: "No minimum-altitude abort and no entry into R-4808N." }
  debrief_focus:
    - "Pod tape for each Maverick: when the track went from area to point, and how long the lock took."
    - "Strafe film: where the first rounds hit compared with the jeep."
    - "How long from cleared hot to the first shot on each group."

narrative:
  operation: "RANGE 61B"
  backstory: |
    December 2037. Before the detachment goes to Georgia, it spends three weeks at Nellis, flying on
    ranges the size of small countries. WREN has built the schedule around the things the Black Sea
    won't give them time to practise, and the first is moving targets.

    Everything the detachment has dropped on so far has stood still. Real targets don't. On Range 61B,
    in Tikaboo Valley, the range crew has three groups of target vehicles driven by remote control up
    and down the dry valley floor. Two Mavericks of each type, a full gun, and one rule: hit the group
    Blackjack calls, and nothing else.
  characters:
    - name: "LCDR Ana \"WREN\" Castellano"
      role: "Detachment training officer, grading from Blackjack's console"
    - name: "BLACKJACK"
      role: "Nellis range control"
    - name: "Nellis Tower"
      role: "Departure and recovery"
    - name: "Chevy 1"
      role: "You, single-ship F/A-18C"
  hook: |
    "Everything you've bombed so far was parked. Today it drives away. Lead it, track it, and don't
    shoot the wrong one." WREN, 0700 brief
  outcomes:
    success: |
      Complete. All three groups destroyed in order, with no fouls and no aborts. WREN signs off
      moving-target qualification, and the detachment's Maverick shots go into the Georgia plan.
    partial: |
      Partial: re-fly items. At least one group got away, or the pass had a foul or an abort. The missed
      events go on Thursday's schedule.
    failure: |
      Incomplete: re-fly the event. A range foul ended the period or R-4808N was entered. The re-fly
      comes after a talk with the Nellis range officer.

situation: |
  Single-ship moving-target qualification on Range 61B, Tikaboo Valley, 110 km north of Nellis. Check
  in with Blackjack at 61B IP at the south end of the valley. Three groups of remote-driven target
  vehicles drive north-south on the valley floor: M-1 (two trucks), M-2 (two BMPs) and M-3 (two
  jeeps, faster than the others). Blackjack clears them hot in that order: Maverick F on M-1, Maverick E
  on M-2, then the gun on M-3. HOLD, east of the valley, is the high key. Nothing on the range shoots.

objectives:
  primary: "Destroy M-1, M-2 and M-3 in order, each with its briefed weapon, with no range fouls."
  secondary: "Every Maverick shot inside its launch zone, and every strafe recovery above 500 ft AGL."
  tertiary: "No minimum-altitude abort and no entry into R-4808N; recover to Nellis."

roe: |
  Live weapons on Range 61B only, on the group Blackjack has cleared hot. Master arm SAFE outside the
  range and whenever the range is cold. No releases north of HOLD's latitude.

