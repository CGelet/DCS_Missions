  - { name: "Chevy (det common)", freq: "254.000 AM", radio: 1, channel: 1, notes: "WREN monitors here" }
  - { name: "BLACKJACK (range control)", freq: "251.500 AM", radio: 1, channel: 2, notes: "Clears each group hot or cold" }
  - { name: "Nellis Tower", freq: "327.000 AM", radio: 2, channel: 1, notes: "TACAN 12X (LSV). Departure and recovery" }
  - { name: "BLACKJACK, WREN", freq: "251.500 AM", notes: "Scripted calls (on-screen text); they don't answer the radio menu" }

