# WORK-UPS event 1: day carrier qualification. Source of truth; `python -m dcsmb build` renders hangar/wu_1_cq_day/.
#
# Training: nothing hidden or random. Launch from Kobuleti, fly out to the Stennis, Case I pattern,
# two touch-and-goes (graded on the LSO tape, the sim can't see them), then two arrested landings.
# The sim detects a trap as below 150 ft MSL and slower than 40 kt after reaching the carrier: that's
# only possible on the deck. Between traps you must climb above 1,000 ft (a cat shot) before the next
# one counts. Carrier and tanker positions are over open sea, 25-40 km west of Batumi.

meta:
  id: wu_1_cq_day
  title: "PADDLES"
  subtitle: "Day Carrier Qualification"
  category: training
  theater: caucasus
  role: "Carrier quals"
  date: 2038-01-15
  start_time: "12:30"
  weather:
    temperature_c: 8
    wind_from_deg: 300
    wind_kts: 12
    clouds: "Scattered 5,000 ft"
    visibility: "20 km"
    qnh_inhg: 30.02
    cloud_preset: LightScattered1
    cloud_base_ft: 5000
  blue_country: USA
  red_country: Russia

training:
  syllabus: "Det work-ups, event CQ-1"
  rules:
    - "Case I: arrive at the initial 3 nm astern at 800 ft, 350 kt. Break inside 4 nm, abeam at 600 ft."
    - "Two touch-and-goes first (hook up), then hook down for two arrested landings. The sim counts traps only."
    - "Between traps: taxi to a catapult and launch. A trap only counts after you've climbed above 1,000 ft again."
    - "Wave-offs are mandatory. Bolter: power up, climb straight ahead to 600 ft, turn downwind."
    - "Bingo 4,000 lb to Kobuleti (TACAN 67X, 60 km east). TEXACO is overhead the boat at 6,000 ft if you need gas."
  knock_it_off: |
    PADDLES or the pilot can call "Knock it off": a fouled deck, a hydraulic caution or a pilot who's
    behind the jet. Climb to 2,000 ft, orbit overhead the boat to port, and wait. Divert to Kobuleti
    if fuel goes below bingo before the deck reopens.
  special_subjects:
    - "Lineup: the deck is moving away from you to the right. Fly the ball and the line, not the boat."
    - "The burble: 12 kt of wind plus 20 kt of ship gives a big burble in close. Small power corrections."
    - "Fuel for the pattern: each pass costs about 400 lb. Count your passes before you need TEXACO."
    - "Cat shot: hands off the stick, salute when you're ready, and fly the climb at 15° nose-up."
  grade_sheet:
    - { item: "Transit and Case I entry", standard: "Arrives at the initial at 800 ft and 350 kt, breaks inside 4 nm." }
    - { item: "Pattern", standard: "Abeam at 600 ft and 1.1-1.3 nm, groove at 15-18 seconds." }
    - { item: "Touch-and-goes", standard: "Two passes, graded by PADDLES from the LSO tape." }
    - { item: "Trap 1", standard: "Arrested landing, graded by PADDLES." }
    - { item: "Cat shot", standard: "Launches from a catapult and climbs above 1,000 ft." }
    - { item: "Trap 2", standard: "Second arrested landing. Two traps complete the qualification." }
  debrief_focus:
    - "PADDLES' grades for every pass: OK, Fair, No Grade."
    - "Pattern timing from the break to the 90."
    - "Fuel at each pass against the plan."

narrative:
  operation: "PADDLES"
  backstory: |
    The detachment landed at Kutaisi last week with ten Hornets and a February partner exercise
    to get ready for. The USS John C. Stennis is passing through the eastern Black Sea for a port call, and the
    strike group has agreed to keep a deck open for the detachment for one afternoon. The Hornets
    are land-based for this deployment, but every pilot has to stay current at the boat, and the
    February exercise will have carrier play.

    It's day, the sea is calm, and the deck is yours for an hour. PADDLES, the strike group's
    landing signal officer, will grade every pass. WREN will be on the platform next to him.
  characters:
    - name: "LCDR Ana \"WREN\" Castellano"
      role: "Detachment training officer, on the LSO platform"
    - name: "LT Marcus \"PADDLES\" Odum"
      role: "Stennis landing signal officer, grading every pass"
    - name: "Mother"
      role: "USS John C. Stennis, 25 km west of Batumi"
    - name: "TEXACO 1"
      role: "S-3B recovery tanker overhead the boat"
    - name: "Ford 1"
      role: "You, single-ship F/A-18C"
  hook: |
    "Fly the ball all the way to the deck. If I wave you off, you go around, every time. The
    boat isn't going anywhere, but it is moving." PADDLES, LSO brief
  outcomes:
    success: |
      Complete. Two traps and a cat shot in between, and PADDLES writes "OK" twice in the greenie
      book. You're carrier-qualified for the exercise. Night quals are tomorrow.
    partial: |
      Partial: re-fly items. One trap is in the book, but you ran out of deck time or gas before
      the second. You'll finish the qual before the night event.
    failure: |
      Incomplete: re-fly the event. No traps in the book. You recover to Kobuleti, and WREN books
      field carrier landing practice before the re-fly.

situation: |
  Single ship from Kobuleti to the Stennis, operating 25 km west of Batumi and steaming into the
  wind (from 300 at 12 kt) at about 20 kt. Case I recovery: two touch-and-goes, then two arrested
  landings, with a catapult launch between them. TEXACO, an S-3B tanker, orbits overhead the boat
  at 6,000 ft. Bingo is 4,000 lb to Kobuleti, 60 km east.

objectives:
  primary: "Two arrested landings aboard the Stennis, with a catapult launch between them."
  secondary: "Two touch-and-goes before the first trap, graded by PADDLES."
  tertiary: "Never below bingo without a plan: TEXACO or Kobuleti."

roe: |
  No weapons. Master arm SAFE. Follow Mother's and PADDLES' instructions: a wave-off is mandatory.

threats:
  - name: "Stennis deck"
    kind: hazard
    lat: 41.7000
    lon: 41.3000
    range_km: 1
    notes: "The landing area is moving away from you to the right at 20 kt. The ship's island is on the starboard side."

comms:
  # F/A-18C: radio 1 = COMM1, radio 2 = COMM2. Radio 1 channel 1 is always the flight frequency.
  - { name: "Ford (det common)", freq: "255.500 AM", radio: 1, channel: 1, notes: "WREN monitors here" }
  - { name: "TEXACO 1 (S-3B)", freq: "253.000 AM", radio: 1, channel: 2, notes: "TACAN 60Y" }
  - { name: "Mother (Stennis)", freq: "127.500 AM", radio: 2, channel: 1, notes: "TACAN 74X, ICLS 1. Answers the ATC menu" }
  - { name: "Kobuleti Tower", freq: "133.000 AM", radio: 2, channel: 2, notes: "TACAN 67X. Bingo field" }
  - { name: "PADDLES, WREN", freq: "127.500 AM", notes: "Scripted calls (on-screen text); they don't answer the radio menu" }

ships:
  - name: "Stennis Group"
    coalition: blue
    type: [Stennis, TICONDEROG]
    lat: 41.7000
    lon: 41.3000
    heading: 300
    speed_kts: 20
    route:
      - { lat: 41.7700, lon: 41.1300 }
      - { lat: 41.8400, lon: 40.9600 }
    tacan: { channel: "74X", callsign: "STN" }
    icls: 1
    freq_mhz: 127.5

flights:
  - callsign: "Ford 1"
    aircraft: FA_18C_hornet
    count: 1
    player: true
    base: Kobuleti
    start: cold
    radio1_mhz: 255.5
    loadout:
      1: AIM_9X_Sidewinder_IR_AAM
      5: FPU_8A_Fuel_Tank_330_gallons
      9: AIM_9X_Sidewinder_IR_AAM
    loadout_summary: "1× 330 gal tank, 2× AIM-9X (inert)"
    bingo_lbs: 4000
    joker_lbs: 5500
    waypoints:
      - { name: "COAST OUT", lat: 41.9000, lon: 41.6500, alt_ft: 5000, kts: 350, eta: "12:47", zone_km: 4 }
      - { name: "INITIAL",   lat: 41.6700, lon: 41.3700, alt_ft: 800,  kts: 350, eta: "12:52", zone_km: 15 }
    land: "Stennis Group"

target:
  name: "The Stennis landing area"
  lat: 41.7000
  lon: 41.3000
  zone_m: 50
  description: "Four wires, angled deck. Target the 3-wire."
  dmpi: "Fly the ball: meatball centred, lineup on the centreline, on speed."

support:
  - kind: tanker
    callsign: "TEXACO 1"
    aircraft: S_3B_Tanker
    coalition: blue
    lat: 41.7200
    lon: 41.2200
    alt_ft: 6000
    heading: 300
    leg_nm: 10
    kts: 250
    freq_mhz: 253.0
    tacan: { channel: "60Y", callsign: "TEX" }

storyboard:
  - phase: "Start and Transit"
    time: "12:30"
    waypoints: ["COAST OUT"]
    brief: |
      Cold start at Kobuleti. Depart west, coast out at 5,000 ft and set TACAN 74X for the boat.
      Check in with Mother before 20 nm.
    script: "WREN checks in from the LSO platform."
    trigger:
      when: { time_after: 10 }
      message: "WREN: Ford one, Wren, on the platform with Paddles. Deck's green. Come and see us."
      seconds: 15

  - phase: "Case I Entry"
    time: "12:52"
    waypoints: ["INITIAL"]
    brief: |
      Descend to 800 ft and 350 kt for the initial, 3 nm astern. Break inside 4 nm to downwind at
      600 ft. Hook UP for the touch-and-goes.
    script: "Reaching the boat area sets flag 50, which arms the trap detection."
    trigger:
      when: { player_in_zone: "INITIAL" }
      set_flag: 50
      message: "MOTHER: Ford one, Mother. Case one, BRC three-zero-zero, deck is ready. Two touch-and-goes, then hook down."
      seconds: 20

  - phase: "Touch-and-goes and Trap 1"
    time: "12:55"
    waypoints: []
    notes: "Ask what the ball was doing at the ramp on each pass before you show the tape."
    brief: |
      Two touch-and-goes with the hook up, then hook down and trap. PADDLES talks to you in the
      groove: listen for "power" and "right for lineup".
    script: "On deck (below 150 ft MSL, under 40 kt) after flag 50: trap 1 (flag 11)."
    trigger:
      when: { player_below_ft: 150, player_slower_kts: 40, flag: 50 }
      set_flag: 11
      message: "PADDLES: Ford one, trap one. OK pass. Taxi to cat one when you're cleared, we'll launch you again."
      seconds: 20

  - phase: "Cat Shot and Trap 2"
    time: "13:10"
    waypoints: []
    brief: |
      Taxi to a catapult, launch, climb above 1,000 ft, and come round for the second trap. If you
      bolter, go round: you have the gas.
    script: "Above 1,000 ft after trap 1 sets flag 12; on deck again after that is trap 2 and completes the event (flag 10)."
    triggers:
      - when: { player_above_ft: 1000, flag: 11 }
        set_flag: 12
        message: "MOTHER: Ford one, good launch. Downwind for trap two."
        seconds: 15
      - when: { player_below_ft: 150, player_slower_kts: 40, flag: 12 }
        set_flag: 10
        message: "PADDLES: Ford one, trap two. That's a qual. Shut down on the bow, Wren's buying."
        seconds: 20
