# IRON GATE chapter 3: hunt the SA-11. Source of truth; `python -m dcsmb build` renders hangar/ig_3_sa11/.
#
# Story device: the site is one of three. ELINT (RIVET) has three candidate positions and calls a bearing
# when you reach HUNT; the call is true for the rolled site. 40%: an SA-8 also moved up to cover the
# battery's northern flank. The route comes in from the west over Racha, a direction the valley's
# radars face least. All three sites are on high ground beside the Great Liakhvi valley (OSM).

meta:
  id: ig_3_sa11
  title: "Operation IRON GATE"
  subtitle: "Hunt the SA-11"
  theater: caucasus
  role: "SEAD"
  date: 2026-04-09
  start_time: "13:40"
  weather:
    temperature_c: 12
    wind_from_deg: 260
    wind_kts: 12
    clouds: "Scattered 9,000 ft"
    visibility: "30 km"
    qnh_inhg: 29.98
    cloud_preset: LightScattered1
    cloud_base_ft: 9000
  blue_country: USA
  red_country: Russia

narrative:
  operation: "IRON GATE"
  backstory: |
    The bridges slowed the column, but they didn't stop it. Engineers had a crossing in by
    yesterday afternoon, and something came over it with them. Last night a Georgian Su-25 on a
    recce run up the valley was shot down at 18,000 ft, far above anything a Strela can reach.
    The pilot's last call was "big radar, big missile."

    That's an SA-11. It changes everything: nobody can work the valley until it's gone. ELINT
    has heard it radiate from three different places in the last day. It moves after it shoots.
  characters:
    - name: "CDR Dana \"SABRE\" Whitfield"
      role: "Detachment commander at Vaziani"
    - name: "RIVET"
      role: "Coalition ELINT aircraft, listening from south of Gori"
    - name: "WIZARD"
      role: "E-3 AWACS"
    - name: "Enfield 1-1 / 1-2"
      role: "You and your wingman, F/A-18C Hornets with HARMs and JSOWs"
  hook: |
    "It's killed one jet already. It's going to be watching the valley for the next one. Don't be
    the next one. Be the one that comes from the side." SABRE, mass brief
  outcomes:
    success: |
      The SA-11's radar and launchers burn on the hillside, and the valley's high sky belongs to the
      coalition again. Gori asks for CAS the same evening.
    partial: |
      Enfield's HARMs silence the radar, but the launchers survive and the battery is back on the
      air by morning with a spare. The valley stays dangerous for another day.
    failure: |
      The SA-11 is still there and still moving. Every sortie into the valley now has to plan around
      a battery nobody can find.

situation: |
  An SA-11 battery is covering the Great Liakhvi valley between Java and Tskhinvali. It shot down a
  Georgian Su-25 last night at 18,000 ft. ELINT has three candidate sites, all on high ground beside
  the valley; it relocates after shooting. RIVET will give you a bearing on the live emitter when you
  reach HUNT. Expect point defence near the battery, and the column's Strelas in the valley floor.

objectives:
  primary: "Destroy the SA-11 battery: radar and launchers."
  secondary: "Get the battery to radiate and kill the radar with HARMs before it can engage."
  tertiary: "Recover both aircraft to Kutaisi."

roe: |
  Weapons free on air defence systems north of Tskhinvali. Weapons tight in Tskhinvali and on the
  Georgian side of the line. No release north of the Roki tunnel.

threats:
  - name: "SA-11 battery: site A, B or C"
    kind: sam
    intel: suspected
    lat: 42.3200
    lon: 43.9300
    area_km: 12
    range_km: 35
    notes: "9K37 Buk. Radiated from three sites in 24 h. Engagement to about 35 km and 70,000 ft."
  - name: "SA-8 covering the battery"
    kind: sam
    intel: possible
    lat: 42.3900
    lon: 43.9500
    area_km: 8
    range_km: 10
    notes: "Brigades usually give a Buk battery an Osa for close defence."
  - name: "Column Strelas"
    kind: sam
    intel: confirmed
    lat: 42.3300
    lon: 43.9350
    area_km: 10
    range_km: 5
    notes: "With the column on the valley floor. Not a factor above 12,000 ft."

comms:
  # F/A-18C: radio 1 = COMM1, radio 2 = COMM2. Radio 1 channel 1 is always the flight frequency.
  - { name: "Enfield (inter-flight)", freq: "258.000 AM", radio: 1, channel: 1 }
  - { name: "WIZARD (AWACS)", freq: "251.000 AM", radio: 1, channel: 2, notes: "Answers the F5 AWACS menu" }
  - { name: "Kutaisi Tower", freq: "134.000 AM", radio: 2, channel: 1, notes: "TACAN 44X" }
  - { name: "RIVET, SABRE", freq: "258.000 AM", notes: "Scripted calls (on-screen text); they don't answer the radio menu" }

flights:
  - callsign: "Enfield 1"
    aircraft: FA_18C_hornet
    count: 2
    player: true
    base: Kutaisi
    start: cold
    radio1_mhz: 258.0
    loadout:
      1: AIM_9X_Sidewinder_IR_AAM
      2: AGM_88C_HARM___High_Speed_Anti_Radiation_Missile_
      3: AGM_154A___JSOW_CEB__CBU_type_
      4: AN_ASQ_228_ATFLIR___Targeting_Pod
      5: FPU_8A_Fuel_Tank_330_gallons
      6: AIM_120C_5_AMRAAM___Active_Rdr_AAM
      7: AGM_154A___JSOW_CEB__CBU_type_
      8: AGM_88C_HARM___High_Speed_Anti_Radiation_Missile_
      9: AIM_9X_Sidewinder_IR_AAM
    loadout_summary: "2× AGM-88C HARM, 2× AGM-154A JSOW, 2× AIM-9X, 1× AIM-120C, ATFLIR, 1× 330 gal tank"
    bingo_lbs: 4500
    joker_lbs: 6500
    waypoints:
      - { name: "ZESTAPONI", lat: 42.1100, lon: 43.0400, alt_ft: 24000, kts: 420, eta: "13:58", zone_km: 4 }
      - { name: "SACHKHERE", lat: 42.3400, lon: 43.4100, alt_ft: 26000, kts: 450, eta: "14:02", zone_km: 4 }
      - { name: "HUNT",      lat: 42.3300, lon: 43.6800, alt_ft: 26000, kts: 450, eta: "14:04", action: sead, zone_km: 6 }
      - { name: "EGRESS",    lat: 42.0000, lon: 43.6000, alt_ft: 28000, kts: 480, eta: "14:10", zone_km: 5 }
    land: Kutaisi

target:
  name: "SA-11 battery"
  lat: 42.3200
  lon: 43.9300
  area_km: 12
  groups: ["Buk Site A", "Buk Site B", "Buk Site C"]
  kill_pct: 75
  description: "A 9S18 search radar, a command post and launchers on high ground beside the valley. One of three sites."
  dmpi: "HARM the radar when it radiates, then JSOWs on the launchers using the position the HARM gives you."

units:
  # Ground truth. Pilots never see this section. One site spawns.
  - name: "Buk Site A"
    coalition: red
    # Ridge west of Java, above the Ksani watershed
    type: [SA_11_Buk_SR_9S18M1, SA_11_Buk_CC_9S470M1, SA_11_Buk_LN_9A310M1, SA_11_Buk_LN_9A310M1]
    lat: 42.3750
    lon: 43.8600
    heading: 240
    late_activation: true
  - name: "Buk Site B"
    coalition: red
    # Hill east of the valley above Gupta
    type: [SA_11_Buk_SR_9S18M1, SA_11_Buk_CC_9S470M1, SA_11_Buk_LN_9A310M1, SA_11_Buk_LN_9A310M1]
    lat: 42.3200
    lon: 44.0000
    heading: 220
    late_activation: true
  - name: "Buk Site C"
    coalition: red
    # Spur north of Tskhinvali, west bank
    type: [SA_11_Buk_SR_9S18M1, SA_11_Buk_CC_9S470M1, SA_11_Buk_LN_9A310M1, SA_11_Buk_LN_9A310M1]
    lat: 42.2850
    lon: 43.9100
    heading: 210
    late_activation: true
  - name: "Flank Osa"
    coalition: red
    type: [Osa_9A33_ln]
    lat: 42.3900
    lon: 43.9500
    heading: 220
    late_activation: true
  - name: "Valley Strelas"
    coalition: red
    type: [Strela_10M3, Strela_10M3]
    lat: 42.3300
    lon: 43.9350
    heading: 180

support:
  - kind: awacs
    callsign: "WIZARD"
    aircraft: E_3A
    coalition: blue
    lat: 41.7500
    lon: 43.2000
    alt_ft: 30000
    heading: 90
    leg_nm: 30
    freq_mhz: 251.0

variants:
  - name: "Which site the SA-11 is using"
    options:
      - label: "Site A, the ridge west of Java"
        activate: ["Buk Site A"]
        when: { player_in_zone: "HUNT" }
        message: "RIVET: Enfield, Rivet. Buk search radar up. Bearing from HUNT zero-six-five, about two-five miles. North end of the valley."
        seconds: 20
      - label: "Site B, the hill above Gupta"
        activate: ["Buk Site B"]
        when: { player_in_zone: "HUNT" }
        message: "RIVET: Enfield, Rivet. Buk search radar up. Bearing from HUNT zero-eight-five, about two-five miles. East side of the valley."
        seconds: 20
      - label: "Site C, the spur north of Tskhinvali"
        activate: ["Buk Site C"]
        when: { player_in_zone: "HUNT" }
        message: "RIVET: Enfield, Rivet. Buk search radar up. Bearing from HUNT one-zero-zero, about one-two miles. South end, near the town."
        seconds: 20

storyboard:
  - phase: "Launch"
    time: "13:40"
    waypoints: ["ZESTAPONI"]
    brief: |
      Cold start at Kutaisi. East past Zestaponi climbing to 24,000 ft. Load the three candidate
      sites as HARM and JSOW targets so you can pick one when RIVET calls.
    script: "SABRE checks in. The site is chosen at HUNT."
    trigger:
      when: { time_after: 10 }
      message: "SABRE: Enfield, Sabre. Rivet is on station. Come in from the west and make it look at you."
      seconds: 15

  - phase: "Over Racha"
    time: "14:02"
    waypoints: ["SACHKHERE"]
    brief: |
      Climb to 26,000 ft over Sachkhere and turn east for HUNT. The ridge between you and the
      valley masks you from anything on the valley floor until you're over it.
    script: "40%: an SA-8 has moved up to the battery's north flank."
    trigger:
      when: { time_after: 5 }
      chance: 40
      activate: ["Flank Osa"]

  - phase: "The Hunt"
    time: "14:04"
    waypoints: ["HUNT"]
    notes: "Ask the room what they'd do if RIVET's bearing pointed at the site closest to Tskhinvali, where the ROE gets tight."
    brief: |
      At HUNT, RIVET will give you a bearing on the live radar. HARM it from outside 35 km if you
      can, then follow up with JSOWs on the launchers. Don't descend into the valley to look.
    script: "The rolled site spawns at HUNT with RIVET's bearing (see variants). Battery 75% dead: success (flag 10)."
    trigger:
      when: { target_destroyed: true }
      set_flag: 10
      message: "RIVET: Enfield, Rivet. Buk radar off the air and it's not coming back. Good kill."
      seconds: 20

  - phase: "Egress"
    time: "14:10"
    waypoints: ["EGRESS"]
    brief: |
      South and climbing to 28,000 ft, away from the valley, then west home to Kutaisi.
    script: "SABRE's closing call."
    trigger:
      when: { player_in_zone: "EGRESS" }
      message: "SABRE: Enfield, Sabre. Copy your egress. Get home and get the tapes to intel."
      seconds: 15
