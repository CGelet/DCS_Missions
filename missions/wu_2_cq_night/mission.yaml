storyboard:
  - phase: "Night Launch"
    time: "18:45"
    waypoints: ["SPLIT"]
    brief: |
      Cold start on deck. Lights on, taxi to the catapult on the director's wands. After the shot,
      climb straight ahead to 1,200 ft, then turn to SPLIT and climb to 6,000 ft.
    script: "Climbing above 1,000 ft sets flag 50 (airborne), which arms the trap detection."
    triggers:
      - when: { time_after: 10 }
        message: "WREN: Ford one, Wren, on the platform. It's dark out there. Fly the numbers and you'll be fine."
        seconds: 15
      - when: { player_above_ft: 1000 }
        set_flag: 50
        message: "MOTHER: Ford one, airborne. Switch Departure, then Marshal at SPLIT."
        seconds: 15

  - phase: "Marshal and Push"
    time: "19:14"
    waypoints: ["MARSHAL", "TEN MILE"]
    brief: |
      Marshal on the 260 radial at 21 nm, angels 6. Push when you arrive: platform at 5,000 ft,
      then 1,200 ft at 10 miles. The sim calls your timing at the 10-mile gate.
    script: "Reaching MARSHAL starts the clock; the TEN MILE gate verdict is the timing call (flag 61 if on time)."
    trigger:
      when: { player_in_zone: "MARSHAL" }
      message: "MARSHAL: Ford one, Marshal. Case three, BRC zero-eight-zero, altimeter three-zero-zero-zero. Push at your discretion."
      seconds: 20

  - phase: "Trap 1"
    time: "19:20"
    waypoints: []
    notes: "Ask when the student called the ball, and what the needles were doing at that moment."
    brief: |
      Dirty up at 8 nm, call the ball at three-quarters of a mile, and fly it to the deck. If you
      bolter, you go round: the bolter pattern brings you back to 6 nm.
    script: "On deck (below 150 ft MSL, under 40 kt) after flag 50: trap 1 (flag 11)."
    trigger:
      when: { player_below_ft: 150, player_slower_kts: 40, flag: 50, time_since_flag: [50, 120] }
      set_flag: 11
      message: "PADDLES: Ford one, trap one. Fair pass, little high in close. We're launching you again."
      seconds: 20

  - phase: "Trap 2"
    time: "19:35"
    waypoints: []
    brief: |
      Launch again, straight ahead to 1,200 ft, then turn downwind and come round for the second
      trap. Tank on TEXACO first if you're below 6,000 lb.
    script: "Above 1,000 ft after trap 1 sets flag 12; on deck again is trap 2 and completes the event (flag 10)."
    triggers:
      - when: { player_above_ft: 1000, flag: 11 }
        set_flag: 12
        message: "MARSHAL: Ford one, airborne. Turn downwind, I'll vector you to final."
        seconds: 15
      - when: { player_below_ft: 150, player_slower_kts: 40, flag: 12 }
        set_flag: 10
        message: "PADDLES: Ford one, trap two. Night qual complete. Welcome to the club."
        seconds: 20
