# HIGH TIDE chapter 5: stop the landing. Source of truth; `python -m dcsmb build` renders hangar/ht_5_beachhead/.
#
# Story device: friendlies in the seeker basket. What's left of the landing force sails for the beach
# at Anaklia at dawn. USS Ross is shadowing it; the sim rolls whether Ross is close alongside the
# convoy (Harpoons are off the table: their seekers can't tell a destroyer from a frigate) or 25 km
# to seaward (Harpoons cleared). MERLIN's call says which. 60%: Su-30s come down from Gudauta.
# A landing ship reaching the BEACH zone is the failure ending. All ship positions over open water.

meta:
  id: ht_5_beachhead
  title: "Operation HIGH TIDE"
  subtitle: "Stop the Landing"
  theater: caucasus
  role: "Anti-ship"
  date: 2038-05-20
  start_time: "04:50"
  weather:
    temperature_c: 15
    wind_from_deg: 200
    wind_kts: 12
    clouds: "Broken 4,000 ft, clear above 7,000 ft"
    visibility: "10 km, dawn"
    qnh_inhg: 29.90
    cloud_preset: Broken3
    cloud_base_ft: 4000
  blue_country: USA
  red_country: Russia

narrative:
  operation: "HIGH TIDE"
  backstory: |
    At 0300, Ochamchire emptied. What was left of the landing force, the ship that survived the
    strike and one that came up from Sochi, sailed south in the dark with a corvette for escort.
    There's only one beach worth landing on: the long sand at Anaklia, forty kilometres away. At ten
    knots, they'll be on it at breakfast.

    USS Ross has been shadowing them since they sailed. She's a destroyer, not an attack ship, and
    the strike group won't let her start a gunfight with a corvette. That job is Springfield's. The
    problem is that Ross is out there in the dark, somewhere near the target.
  characters:
    - name: "CAPT Lena \"MERLIN\" Ostrowski"
      role: "CAG, aboard the Stennis"
    - name: "CDR Owen Pike"
      role: "Captain, USS Ross, shadowing the landing force"
    - name: "DARKSTAR"
      role: "E-2C Hawkeye"
    - name: "Springfield 1-1 / 1-2"
      role: "You and your wingman, F/A-18C Hornets"
  hook: |
    "If they get to the sand, it's an army's problem for a month. If they don't, it's ours for an
    hour. Make it ours." MERLIN, 0430 brief
  outcomes:
    success: |
      Both landing ships go down short of Anaklia, with the corvette damaged and limping north. No
      soldier from Ochamchire sets foot on the beach. HIGH TIDE is over.
    partial: |
      One landing ship gets through and puts a battalion on the sand at Anaklia. The Georgian army
      contains it in two days, but it's a fight nobody wanted.
    failure: |
      Both ships reach the beach. By noon there's a brigade ashore at Anaklia, and the war has a new
      front forty minutes from Poti.

situation: |
  Two landing ships and a corvette are steaming south-southeast from Ochamchire toward the beach at
  Anaklia, about 40 km away, at 10 kt. USS Ross is shadowing them; MERLIN will tell you where she is
  when you check in. The corvette has SA-N-4 and guns. Gudauta's Su-30s are expected to cover the
  landing. Sink the landing ships before they reach the beach.

objectives:
  primary: "Sink both landing ships before they reach the beach at Anaklia."
  secondary: "No weapons on USS Ross: Harpoons only if MERLIN clears them."
  tertiary: "Recover both aircraft aboard the Stennis."

roe: |
  Weapons free on the landing force. Harpoons only when MERLIN confirms USS Ross is clear of the
  convoy; otherwise visual identification on the pod and laser or Maverick weapons only.

threats:
  - name: "Corvette escort"
    kind: sam
    intel: confirmed
    lat: 42.6000
    lon: 41.3200
    area_km: 8
    range_km: 15
    notes: "Grisha-class. SA-N-4 to about 15 km and 57 mm guns. Shooting it is optional; staying out of its range isn't."
  - name: "Su-30s (Gudauta)"
    kind: air
    intel: suspected
    lat: 43.1143
    lon: 40.5697
    range_km: 0
    notes: "Two Su-30s were on the Gudauta ramp yesterday, armed. They'll cover the landing if they can."
  - name: "USS Ross (FRIENDLY)"
    kind: hazard
    lat: 42.5500
    lon: 41.2000
    area_km: 15
    range_km: 0
    notes: "Arleigh Burke-class destroyer shadowing the convoy. Position at launch from MERLIN."

comms:
  # F/A-18C: radio 1 = COMM1, radio 2 = COMM2. Radio 1 channel 1 is always the flight frequency.
  - { name: "Springfield (inter-flight)", freq: "256.000 AM", radio: 1, channel: 1 }
  - { name: "DARKSTAR (E-2C)", freq: "251.000 AM", radio: 1, channel: 2, notes: "Answers the F5 AWACS menu" }
  - { name: "TEXACO 1 (S-3B)", freq: "253.000 AM", radio: 1, channel: 3, notes: "TACAN 60Y" }
  - { name: "Mother (Stennis)", freq: "127.500 AM", radio: 2, channel: 1, notes: "TACAN 74X, ICLS 1. Answers the ATC menu" }
  - { name: "MERLIN, USS Ross", freq: "256.000 AM", notes: "Scripted calls (on-screen text); they don't answer the radio menu" }

