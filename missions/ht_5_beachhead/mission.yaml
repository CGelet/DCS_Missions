flights:
  - callsign: "Springfield 1"
    aircraft: FA_18C_hornet
    count: 2
    player: true
    base: "Stennis Group"
    start: cold
    radio1_mhz: 256.0
    laser_codes: [1688]
    loadout:
      1: AIM_9X_Sidewinder_IR_AAM
      2: AGM_84D_Harpoon_AShM
      3: BRU_33_with_2_x_GBU_12___500lb_Laser_Guided_Bomb
      4: AN_ASQ_228_ATFLIR___Targeting_Pod
      5: FPU_8A_Fuel_Tank_330_gallons
      6: AIM_120C_5_AMRAAM___Active_Rdr_AAM
      7: BRU_33_with_2_x_GBU_12___500lb_Laser_Guided_Bomb
      8: LAU_117_AGM_65F
      9: AIM_9X_Sidewinder_IR_AAM
    loadout_summary: "1× AGM-84D Harpoon, 4× GBU-12, 1× AGM-65F, 2× AIM-9X, 1× AIM-120C, ATFLIR, 1× 330 gal tank"
    bingo_lbs: 4500
    joker_lbs: 6500
    waypoints:
      - { name: "CHECK IN", lat: 42.2500, lon: 41.0500, alt_ft: 18000, kts: 420, eta: "05:12", zone_km: 8 }
      - { name: "INTERCEPT", lat: 42.4800, lon: 41.3000, alt_ft: 16000, kts: 420, eta: "05:16", action: antiship, zone_km: 10 }
      - { name: "RECOVER",  lat: 42.1500, lon: 40.9000, alt_ft: 18000, kts: 420, eta: "05:45", zone_km: 6 }
    land: "Stennis Group"

target:
  name: "The landing ships"
  lat: 42.5800
  lon: 41.4000
  area_km: 10
  groups: ["Landing Force"]
  description: "Two Ropucha-class landing ships steaming south-southeast at 10 kt, a corvette astern of them."
  dmpi: "Bridge and stern ramp. GBU-12s from above the SA-N-4 if you can, Maverick from outside it."

zones:
  - { name: "BEACH", lat: 42.4000, lon: 41.5400, radius_km: 3 }

support:
  - kind: awacs
    callsign: "DARKSTAR"
    aircraft: E_2C
    coalition: blue
    lat: 42.0000
    lon: 40.7500
    alt_ft: 25000
    heading: 200
    leg_nm: 25
    freq_mhz: 251.0
  - kind: tanker
    callsign: "TEXACO 1"
    aircraft: S_3B_Tanker
    coalition: blue
    lat: 42.1000
    lon: 40.9500
    alt_ft: 8000
    heading: 200
    leg_nm: 15
    kts: 260
    freq_mhz: 253.0
    tacan: { channel: "60Y", callsign: "TEX" }
  # Red: director only
  - kind: intercept
    callsign: "Gudauta Su-30s"
    aircraft: Su_30
    coalition: red
    count: 2
    base: Gudauta
    late_activation: true

variants:
  - name: "Where USS Ross is"
    options:
      - label: "Close alongside the convoy: no Harpoons"
        activate: ["USS Ross Close"]
        when: { player_in_zone: "CHECK IN" }
        message: "MERLIN: Springfield, Merlin. Ross is in close, two miles off the convoy's port quarter. No Harpoons. Eyes on every shot."
        seconds: 25
      - label: "Fifteen miles to seaward: Harpoons cleared"
        activate: ["USS Ross Seaward"]
        when: { player_in_zone: "CHECK IN" }
        message: "MERLIN: Springfield, Merlin. Ross is fifteen miles to seaward of the convoy. Harpoons cleared on the landing ships."
        seconds: 25

storyboard:
  - phase: "Launch"
    time: "04:50"
    waypoints: ["CHECK IN"]
    brief: |
      Cold start at dawn. Launch and climb northeast to CHECK IN at 18,000 ft. MERLIN will tell you
      where USS Ross is, and so whether the Harpoon is cleared.
    script: "Ross's position is rolled; it spawns at CHECK IN with MERLIN's call (see variants)."
    trigger:
      when: { time_after: 10 }
      message: "MERLIN: Springfield, Merlin. They're forty minutes from the beach. Check in when you're up."
      seconds: 15

  - phase: "Find Them"
    time: "05:16"
    waypoints: ["INTERCEPT"]
    notes: "Ask the room: three ship-sized contacts on the radar, and Ross is somewhere near them. How do you know which is which?"
    brief: |
      Run in toward INTERCEPT under the cloud if you need to see. Find the convoy on the radar,
      identify every hull on the pod, and attack the landing ships. The corvette can wait.
    script: "60%: Gudauta's Su-30s launch as you reach INTERCEPT."
    triggers:
      - when: { player_in_zone: "INTERCEPT" }
        chance: 60
        activate: ["Gudauta Su-30s"]
        message: "DARKSTAR: Springfield, Darkstar. Two contacts departing Gudauta, fast, heading southeast toward you. Hostile."
        seconds: 20
      - when: { player_in_zone: "INTERCEPT" }
        message: "USS ROSS: Springfield, Ross. I've got the convoy on radar, they haven't changed course. They're yours."
        seconds: 15

  - phase: "Stop the Landing"
    time: "05:20"
    waypoints: []
    brief: |
      Sink both landing ships before they reach the beach at Anaklia. Stay above the corvette's
      SA-N-4 where you can. Nothing goes near Ross.
    script: "Landing force destroyed: success (flag 10). A landing ship reaching BEACH: failure (flag 20). Any hit on Ross: flag 22."
    triggers:
      - when: { target_destroyed: true }
        set_flag: 10
        message: "USS ROSS: Springfield, Ross. Both landing ships are dead in the water and settling. The corvette's turning north. Nice work."
        seconds: 20
      - when: { group_in_zone: ["Landing Force", "BEACH"], flag_false: 10 }
        set_flag: 20
        message: "MERLIN: Springfield, Merlin. They're at the beach. Ramps are down."
        seconds: 20
      - when: { group_life_below: ["USS Ross Close", 100] }
        set_flag: 22
        message: "USS ROSS: Check fire, check fire! Ross is hit! We're hit!"
        seconds: 20

  - phase: "Home"
    time: "05:45"
    waypoints: ["RECOVER"]
    brief: |
      Back southwest and recover aboard the Stennis. TEXACO is overhead.
    script: "MERLIN closes HIGH TIDE."
    trigger:
      when: { player_in_zone: "RECOVER", flag: 10 }
      message: "MERLIN: Springfield, Merlin. That's the end of it. Come home."
      seconds: 15
