    coalition: blue
    type: [M_2_Bradley, M_2_Bradley, M_2_Bradley, Hummer]
    lat: 41.5000
    lon: 45.2400
    heading: 0
  - name: "AXEMAN"
    coalition: blue
    type: [JTAC]
    lat: 41.4995
    lon: 45.2395
    heading: 0
  - name: "Target 1 Trucks"
    coalition: red
    type: [Ural_375, GAZ_66]
    lat: 41.5085
    lon: 45.2410
    heading: 180
    hold_fire: true
  - name: "Target 2 BMPs"
