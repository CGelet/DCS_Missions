      - { name: "CONTACT POINT", lat: 41.5800, lon: 45.1800, alt_ft: 15000, kts: 350, eta: "13:35", zone_km: 4 }
      - { name: "IP NORTH",      lat: 41.5800, lon: 45.2400, alt_ft: 12000, kts: 350, eta: "13:40", action: cas, zone_km: 3 }
      - { name: "EXIT",          lat: 41.6300, lon: 45.1200, alt_ft: 12000, kts: 380, eta: "14:05", zone_km: 4 }
    land: Vaziani

target:
  name: "AXEMAN's targets"
  lat: 41.5085
  lon: 45.2410
  groups: ["Target 1 Trucks", "Target 2 BMPs"]
  description: "Two inert target groups next to a friendly platoon. AXEMAN gives you one 9-line at a time."
  dmpi: "Target 1: lead truck, then the second. Target 2: one weapon per BMP, attack heading north-south."

