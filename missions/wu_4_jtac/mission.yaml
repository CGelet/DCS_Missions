storyboard:
  - phase: "Start and Check-in"
    time: "13:15"
    waypoints: ["CONTACT POINT"]
    brief: |
      Cold start at Vaziani, laser code 1688. Depart east to CONTACT POINT at 15,000 ft and check in
      with AXEMAN: position, ordnance, playtime.
    script: "AXEMAN answers the check-in at CONTACT POINT with 9-line one (flag 50)."
    triggers:
      - when: { time_after: 10 }
        message: "WREN: Dodge one, Wren, at the OP with Axeman. He's ready when you are."
        seconds: 15
      - when: { player_in_zone: "CONTACT POINT" }
        set_flag: 50
        message: "AXEMAN: Dodge one, Axeman. Type two control. From IP NORTH, heading one-eight-zero. Target elevation two-four-zero-zero. Two trucks in the dry stream bed, one kilometre north of my position. Friendlies at the track junction, three Bradleys. Egress north. Report IP inbound."
        seconds: 40

  - phase: "Target 1"
    time: "13:40"
    waypoints: ["IP NORTH"]
    notes: "Ask the student which line of the 9-line they'd refuse to fly without, and why."
    brief: |
      Fly to IP NORTH and run in heading 180. Find the track junction and the Bradleys first, then
      the stream bed north of them, then the trucks. Wait for "cleared hot".
    script: "Target 1 dead after the 9-line sets flag 11 and AXEMAN passes 9-line two."
    triggers:
      - when: { player_in_zone: "IP NORTH", flag: 50 }
        message: "AXEMAN: Dodge one, I have you. Continue. Look at the track junction south of you. The stream bed runs east-west, one kilometre north of it. Two trucks in the bed. Cleared hot."
        seconds: 30
      - when: { group_dead: "Target 1 Trucks", flag: 50 }
        set_flag: 11
        message: "AXEMAN: Good effects, both trucks. Dodge one, next 9-line. Two BMPs dug in, six hundred and fifty metres east of my position. Danger close. Attack heading north-south only. Report IP inbound."
        seconds: 35

  - phase: "Target 2: Danger Close"
    time: "13:52"
    waypoints: []
    brief: |
      Danger close: the BMPs are 650 m from the platoon. North-south heading only, so nothing long
      or short lands on the friendlies. Precision weapons are the right answer here.
    script: "Target 2 dead after target 1 completes the event (flag 10). Any damage to the platoon is fratricide (flag 22)."
    triggers:
      - when: { group_dead: "Target 2 BMPs", flag: 11 }
        set_flag: 10
        message: "AXEMAN: Both BMPs destroyed. Friendlies are fine. End of mission, Dodge one. Thanks for the work."
        seconds: 20
      - when: { group_life_below: ["Friendly Platoon", 100] }
        set_flag: 22
        message: "AXEMAN: Abort, abort, abort! Weapons on the friendlies. Knock it off, Dodge one, master arm safe."
        seconds: 20

  - phase: "Recovery"
    time: "14:05"
    waypoints: ["EXIT"]
    brief: |
      Off to the northwest via EXIT, master arm SAFE, and recover to Vaziani.
    script: "WREN's closing call."
    trigger:
      when: { player_in_zone: "EXIT", flag: 50 }
      message: "WREN: Dodge one, Wren. Axeman's writing up your passes. See you at the debrief."
      seconds: 15
