# IRON GATE chapter 1: armed reconnaissance up the Liakhvi valley. Source of truth; `python -m dcsmb build` renders hangar/ig_1_recce/.
#
# Story device: nobody knows how far south the column got overnight. The sim rolls where its vanguard
# is (in the gorge north of Java, south of Java, or already at the north edge of Tskhinvali), and 50%
# that a Strela-10 rides with it. Pilots get only "somewhere between the tunnel and Tskhinvali".
# Vanguard positions are on the Transcam road (OSM): Java south, Gupta, and Tskhinvali north.

meta:
  id: ig_1_recce
  title: "Operation IRON GATE"
  subtitle: "Armed Recce, Liakhvi Valley"
  theater: caucasus
  role: "Armed recce"
  date: 2038-04-06
  start_time: "06:20"
  weather:
    temperature_c: 7
    wind_from_deg: 320
    wind_kts: 8
    clouds: "Broken 7,000 ft over the valley, mountain tops in cloud"
    visibility: "15 km, morning haze in the valley"
    qnh_inhg: 29.94
    cloud_preset: Broken3
    cloud_base_ft: 7000
  blue_country: USA
  red_country: Russia

narrative:
  operation: "IRON GATE"
  backstory: |
    At 0200 the Roki tunnel border post stopped answering the phone. By 0400, Georgian police at
    Tskhinvali's northern checkpoint were reporting engine noise in the gorge: tracks, a lot of them,
    coming south. Nobody has seen the column yet. The valley is under cloud, and the drones that
    went up at first light came back with nothing but grey.

    The detachment at Vaziani was due to fly home in two weeks. Instead, the Georgian government
    has asked the coalition for help, and Enfield flight is going up the valley to find out how much
    is coming, and how far it got in the night.
  characters:
    - name: "CDR Dana \"SABRE\" Whitfield"
      role: "Detachment commander at Vaziani"
    - name: "Col. Irakli Gelashvili"
      role: "Georgian Land Forces operations, Gori"
    - name: "WIZARD"
      role: "E-3 AWACS, holding south of Tbilisi"
    - name: "Enfield 1-1 / 1-2"
      role: "You and your wingman, F/A-18C Hornets"
  hook: |
    "Find the front of it. Tell me what it is. If you can stop the first few vehicles, do it.
    Everything behind them will have to wait." Col. Gelashvili, 0530 phone call
  outcomes:
    success: |
      The vanguard burns on the Transcam road, and Enfield's ATFLIR tape gives Gori its first real
      look at the column: a mechanized brigade, not a raid. The Georgian army has a day to dig in.
    partial: |
      Enfield finds the column, but the vanguard keeps rolling. By noon its lead vehicles are at the
      edge of Tskhinvali, and the Georgian army has hours instead of a day.
    failure: |
      Enfield comes home without finding the column. It reaches Tskhinvali's northern edge at 0900,
      and the first anyone sees of it is on Georgian television.

situation: |
  An armoured column of unknown size is moving south through the Roki tunnel and down the Great
  Liakhvi valley toward Tskhinvali and Gori. Its lead elements could be anywhere between the tunnel
  and Tskhinvali's northern edge. Georgian forces hold Gori and the villages north of it. Expect
  short-range air defence with the column. Nothing has been seen in the air.

objectives:
  primary: "Find the column's vanguard and destroy it."
  secondary: "Get ATFLIR video of the column behind the vanguard for Gori."
  tertiary: "Recover both aircraft to Vaziani."

roe: |
  Weapons free on military vehicles moving south on the Transcam road north of Tskhinvali. Weapons
  tight in Tskhinvali itself and south of it: Georgian police and civilians are on the roads. No
  release north of the Roki tunnel.

threats:
  - name: "The column"
    kind: armor
    intel: suspected
    lat: 42.4000
    lon: 43.9400
    area_km: 18
    range_km: 0
    notes: "Tracks heard in the gorge overnight. Somewhere between the tunnel and Tskhinvali."
  - name: "Mobile short-range SAMs with the column"
    kind: sam
    intel: possible
    lat: 42.3500
    lon: 43.9400
    area_km: 18
    range_km: 5
    notes: "A brigade on the move usually brings Strela-10s or Osas. Nobody has seen any."
  - name: "MANPADS"
    kind: aaa
    intel: possible
    lat: 42.3500
    lon: 43.9400
    area_km: 18
    range_km: 5
    notes: "Assume every vehicle has one. Stay above 10,000 ft AGL unless you need to come down."

comms:
  # F/A-18C: radio 1 = COMM1, radio 2 = COMM2. Radio 1 channel 1 is always the flight frequency.
  - { name: "Enfield (inter-flight)", freq: "258.000 AM", radio: 1, channel: 1 }
  - { name: "WIZARD (AWACS)", freq: "251.000 AM", radio: 1, channel: 2, notes: "Answers the F5 AWACS menu" }
  - { name: "Vaziani Tower", freq: "140.000 AM", radio: 2, channel: 1, notes: "TACAN 22X" }
  - { name: "Tbilisi-Lochini Tower (divert)", freq: "138.000 AM", radio: 2, channel: 2 }
  - { name: "SABRE, Col. Gelashvili", freq: "258.000 AM", notes: "Scripted calls (on-screen text); they don't answer the radio menu" }

flights:
  - callsign: "Enfield 1"
    aircraft: FA_18C_hornet
    count: 2
    player: true
    base: Vaziani
    start: cold
    radio1_mhz: 258.0
    laser_codes: [1688]
    loadout:
      1: AIM_9X_Sidewinder_IR_AAM
      2: LAU_117_AGM_65F
      3: BRU_33_with_2_x_GBU_12___500lb_Laser_Guided_Bomb
      4: AN_ASQ_228_ATFLIR___Targeting_Pod
      5: FPU_8A_Fuel_Tank_330_gallons
      6: AIM_120C_5_AMRAAM___Active_Rdr_AAM
      7: BRU_33_with_2_x_GBU_12___500lb_Laser_Guided_Bomb
      8: LAU_117_AGM_65F
      9: AIM_9X_Sidewinder_IR_AAM
    loadout_summary: "4× GBU-12, 2× AGM-65F Maverick, 2× AIM-9X, 1× AIM-120C, ATFLIR, 1× 330 gal tank"
    bingo_lbs: 4000
    joker_lbs: 6000
    waypoints:
      - { name: "MTSKHETA",  lat: 41.8500, lon: 44.7000, alt_ft: 18000, kts: 420, eta: "06:42", zone_km: 4 }
      - { name: "GORI",      lat: 42.0000, lon: 44.1200, alt_ft: 18000, kts: 380, eta: "06:47", zone_km: 6 }
      - { name: "TSKHINVALI", lat: 42.2500, lon: 43.9600, alt_ft: 16000, kts: 330, eta: "06:51", action: cas, zone_km: 8 }
      - { name: "JAVA",      lat: 42.4000, lon: 43.9300, alt_ft: 17000, kts: 330, eta: "06:55", zone_km: 8 }
      - { name: "EXIT",      lat: 42.0000, lon: 44.4500, alt_ft: 22000, kts: 420, eta: "07:20", zone_km: 5 }
    land: Vaziani

target:
  name: "The column's vanguard"
  lat: 42.3300
  lon: 43.9350
  area_km: 10
  groups: ["Vanguard Gorge", "Vanguard Gupta", "Vanguard Tskhinvali"]
  description: "The lead armoured vehicles of a southbound column on the Transcam road. Position unknown: start at Tskhinvali and work north."
  dmpi: "The lead vehicle first, to block the road, then the rest. Mavericks on armour, GBU-12s on anything bunched up."

units:
  # Ground truth. Pilots never see this section. One vanguard spawns, where the variant puts it.
  - name: "Vanguard Gorge"
    coalition: red
    # In the gorge, still 2 km north of Java on the Transcam road
    type: [T_72B, BMP_2, BMP_2, BTR_80]
    lat: 42.4150
    lon: 43.9350
    heading: 180
    late_activation: true
    speed_kmh: 20
    route:
      - { lat: 42.3904, lon: 43.9230 }
      - { lat: 42.3300, lon: 43.9350 }
  - name: "Vanguard Gupta"
    coalition: red
    # South of Java, at Gupta, halfway to Tskhinvali
    type: [T_72B, BMP_2, BMP_2, BTR_80]
    lat: 42.3300
    lon: 43.9350
    heading: 180
    late_activation: true
    speed_kmh: 20
    route:
      - { lat: 42.2800, lon: 43.9500 }
      - { lat: 42.2550, lon: 43.9600 }
  - name: "Vanguard Tskhinvali"
    coalition: red
    # Already at Tskhinvali's northern edge
    type: [T_72B, BMP_2, BMP_2, BTR_80]
    lat: 42.2600
    lon: 43.9580
    heading: 180
    late_activation: true
  - name: "Column Main Body"
    coalition: red
    # Always in the gorge behind the vanguard: for the ATFLIR tape, not a target
    type: [T_72B, T_72B, BMP_2, Ural_375, Ural_375, ATZ_10]
    lat: 42.4500
    lon: 43.9600
    heading: 200
  - name: "Vanguard Strela"
    coalition: red
    type: [Strela_10M3]
    lat: 42.3320
    lon: 43.9360
    heading: 180
    late_activation: true

support:
  - kind: awacs
    callsign: "WIZARD"
    aircraft: E_3A
    coalition: blue
    lat: 41.5000
    lon: 44.6000
    alt_ft: 30000
    heading: 90
    leg_nm: 30
    freq_mhz: 251.0

variants:
  - name: "Where the vanguard got to"
    options:
      - label: "Still in the gorge north of Java"
        activate: ["Vanguard Gorge"]
      - label: "At Gupta, halfway to Tskhinvali"
        activate: ["Vanguard Gupta"]
      - label: "Already at Tskhinvali's northern edge"
        activate: ["Vanguard Tskhinvali"]

storyboard:
  - phase: "Launch"
    time: "06:20"
    waypoints: ["MTSKHETA"]
    brief: |
      Cold start at Vaziani at first light. Depart northwest past Mtskheta at 18,000 ft. WIZARD has
      the air picture; Gori has nothing new.
    script: "The vanguard variant spawns at mission start (one of three positions). SABRE checks in."
    trigger:
      when: { time_after: 10 }
      message: "SABRE: Enfield, Sabre. Gori still has nothing on the column. You're the first eyes up there. Find the front of it."
      seconds: 15

  - phase: "Into the Valley"
    time: "06:47"
    waypoints: ["GORI", "TSKHINVALI"]
    brief: |
      From Gori, follow the Transcam road north. Pods on the road from Tskhinvali's northern edge;
      remember you're weapons tight in the town itself. Stay above 10,000 ft AGL while you search.
    script: "50%: a Strela-10 rides with the vanguard at Gupta (it only matters if that's where the vanguard is). Gelashvili calls when you reach Gori."
    triggers:
      - when: { player_in_zone: "GORI" }
        message: "COL. GELASHVILI: Enfield, this is Gori. My police at the north checkpoint can hear engines but see nothing. The road north of town is yours."
        seconds: 20
      - when: { time_after: 5 }
        chance: 50
        activate: ["Vanguard Strela"]

  - phase: "Find the Front"
    time: "06:51"
    waypoints: ["JAVA"]
    notes: "Ask the room: you've searched Tskhinvali's edge and found nothing. How far north do you go before the fuel says no?"
    brief: |
      Work north from Tskhinvali toward Java until you find the lead vehicles. Stop the first one to
      block the road, then work back. Film whatever's behind them.
    script: "Vanguard destroyed: success (flag 10). Vanguard reaching TSKHINVALI unharmed is the partial ending (flag 20)."
    triggers:
      - when: { target_destroyed: true }
        set_flag: 10
        message: "COL. GELASHVILI: Enfield, Gori. We see the smoke from here. That's the front of it stopped. Thank you."
        seconds: 20
      - when: { group_in_zone: ["Vanguard Gupta", "TSKHINVALI"], flag_false: 10 }
        set_flag: 20
        message: "COL. GELASHVILI: Enfield, my checkpoint has tracks in sight. They're at the edge of town."
        seconds: 20

  - phase: "Home"
    time: "07:20"
    waypoints: ["EXIT"]
    brief: |
      Climb out southeast to 22,000 ft and recover to Vaziani. Tbilisi-Lochini is the divert.
    script: "SABRE asks for the tape."
    trigger:
      when: { player_in_zone: "EXIT" }
      message: "SABRE: Enfield, Sabre. Get the tape to intel as soon as you're down. This isn't going to be a one-day thing."
      seconds: 15
