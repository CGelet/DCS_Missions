    coalition: blue
    type: [Stennis, TICONDEROG, USS_Arleigh_Burke_IIa]
    lat: 41.9000
    lon: 41.0000
    heading: 90
    speed_kts: 14
    route:
      - { lat: 41.9000, lon: 41.1500 }
      - { lat: 41.9000, lon: 41.3000 }
    tacan: { channel: "74X", callsign: "STN" }
    icls: 1
    freq_mhz: 127.5
  - name: "Georgian Coast Guard"
    coalition: blue
    type: [La_Combattante_II]
    lat: 42.1520
    lon: 41.6300
    heading: 270
  # Red: director only. One channel's boats spawn.
  - name: "Minelayers North"
    coalition: red
    type: [MOLNIYA, MOLNIYA, MOLNIYA]
    lat: 42.2600
    lon: 41.4000
    heading: 150
    speed_kts: 8
    late_activation: true
    route:
      - { lat: 42.2100, lon: 41.5600 }
      - { lat: 42.1900, lon: 41.6100 }
  - name: "Minelayers South"
    coalition: red
    type: [MOLNIYA, MOLNIYA, MOLNIYA]
    lat: 42.2000
    lon: 41.3500
    heading: 110
    speed_kts: 8
    late_activation: true
    route:
      - { lat: 42.1200, lon: 41.5500 }
      - { lat: 42.1000, lon: 41.6200 }
  - name: "Decoy Boat"
    coalition: red
    type: [MOLNIYA]
    lat: 42.0500
    lon: 41.4000
    heading: 200
    speed_kts: 30
    late_activation: true
    route:
      - { lat: 41.8000, lon: 41.4500 }

flights:
  - callsign: "Springfield 1"
    aircraft: FA_18C_hornet
    count: 2
    player: true
    base: "Stennis Group"
    start: cold
    radio1_mhz: 256.0
    loadout:
      1: AIM_9X_Sidewinder_IR_AAM
      2: LAU_117_AGM_65F
      3: BRU_33_with_2_x_GBU_12___500lb_Laser_Guided_Bomb
      4: AN_ASQ_228_ATFLIR___Targeting_Pod
      5: FPU_8A_Fuel_Tank_330_gallons
      6: AIM_120C_5_AMRAAM___Active_Rdr_AAM
      7: BRU_33_with_2_x_GBU_12___500lb_Laser_Guided_Bomb
      8: LAU_117_AGM_65F
      9: AIM_9X_Sidewinder_IR_AAM
    loadout_summary: "2× AGM-65F Maverick, 4× GBU-12, 2× AIM-9X, 1× AIM-120C, ATFLIR, 1× 330 gal tank, 578 rounds 20 mm"
    bingo_lbs: 4500
    joker_lbs: 6500
    laser_codes: [1688]
    waypoints:
      - { name: "MARSH",    lat: 41.9500, lon: 41.0500, alt_ft: 15000, kts: 400, eta: "22:30", zone_km: 5 }
      - { name: "HUNT",     lat: 42.1800, lon: 41.4500, alt_ft: 12000, kts: 380, eta: "22:36", action: antiship, zone_km: 12 }
      - { name: "RETURN",   lat: 41.9500, lon: 41.2000, alt_ft: 15000, kts: 400, eta: "23:10", zone_km: 6 }
    land: "Stennis Group"

target:
  name: "The minelayers"
  lat: 42.1800
  lon: 41.5000
  area_km: 12
  groups: ["Minelayers North", "Minelayers South"]
  description: "Three small fast boats running slow lines across one of Poti's approach channels, unlit."
  dmpi: "Maverick on the lead boat, GBU-12s on the others while they're slow. The last one will run: guns or a Maverick."

zones:
  - { name: "MINEFIELD NORTH", lat: 42.1900, lon: 41.6100, radius_km: 1.5 }
  - { name: "MINEFIELD SOUTH", lat: 42.1000, lon: 41.6200, radius_km: 1.5 }

support:
  - kind: awacs
    callsign: "DARKSTAR"
    aircraft: E_2C
    coalition: blue
    lat: 41.8500
    lon: 40.9000
    alt_ft: 25000
    heading: 90
    leg_nm: 25
    freq_mhz: 251.0
  - kind: tanker
    callsign: "TEXACO 1"
    aircraft: S_3B_Tanker
    coalition: blue
    lat: 41.9200
    lon: 41.1000
    alt_ft: 8000
    heading: 90
    leg_nm: 15
    kts: 260
    freq_mhz: 253.0
    tacan: { channel: "60Y", callsign: "TEX" }

variants:
  - name: "Which channel"
    options:
      - label: "North channel, off the Rioni mouth"
        activate: ["Minelayers North"]
        when: { time_after: 5 }
      - label: "South channel, off Kulevi"
        activate: ["Minelayers South"]
        when: { time_after: 5 }

storyboard:
  - phase: "Night Launch"
    time: "22:10"
    waypoints: ["MARSH"]
    brief: |
      Cold start on deck, night launch. Join at MARSH and push east at 15,000 ft. Radar in sea
      mode, pod in IR. The boats will be the only things moving slowly with no lights.
    script: "The channel is rolled at start; the boats are already on their way. 40%: a decoy boat runs south toward Batumi."
    triggers:
      - when: { time_after: 10 }
        message: "MERLIN: Springfield, Merlin. Poti says the boats are still out there. Go."
        seconds: 15
      - when: { time_after: 5 }
        chance: 40
        activate: ["Decoy Boat"]

  - phase: "The Hunt"
    time: "22:36"
    waypoints: ["HUNT"]
    notes: "Ask the room: one fast contact running south, three slow ones near the coast. Which do you look at first?"
    brief: |
      Search the approaches from HUNT at 12,000 ft. Slow contacts in a line near the channel are what
      you're after; anything running fast may be a decoy. Identify on the pod, then shoot.
    script: "Poti Coast Guard calls when you reach HUNT. They hear engines but don't know which channel."
    trigger:
      when: { player_in_zone: "HUNT" }
      message: "POTI COAST GUARD: Springfield, Poti Coast Guard. We hear engines out there, low and slow. We can't see anything. We're lit up in the harbour mouth: don't shoot us."
      seconds: 20

  - phase: "Stop the Laying"
    time: "22:42"
    waypoints: []
    brief: |
      Sink the lead boat first: it's the one that knows where the line goes. Watch your altitude:
      their guns reach 4,000 ft.
    script: "Minelayers destroyed: success (flag 10). A minelayer group reaching its MINEFIELD zone first is the partial ending (flag 20). Any hit on the coast guard: flag 22."
    triggers:
      - when: { target_destroyed: true }
        set_flag: 10
        message: "PRISM: Springfield, Prism. Darkstar's lost the slow contacts. They're gone. Good shooting."
        seconds: 15
      - when: { group_in_zone: ["Minelayers North", "MINEFIELD NORTH"], flag_false: 10 }
        set_flag: 20
        message: "POTI COAST GUARD: Springfield, the boats are turning back north. I think they finished a line."
        seconds: 20
      - when: { group_in_zone: ["Minelayers South", "MINEFIELD SOUTH"], flag_false: 10 }
        set_flag: 20
        message: "POTI COAST GUARD: Springfield, the boats are turning back north. I think they finished a line."
        seconds: 20
      - when: { group_life_below: ["Georgian Coast Guard", 100] }
        set_flag: 22
        message: "POTI COAST GUARD: Check fire! Check fire! We're hit! That's the coast guard!"
        seconds: 20

  - phase: "Home"
    time: "23:10"
    waypoints: ["RETURN"]
    brief: |
      Back west at 15,000 ft and a night Case III to the Stennis. TEXACO is overhead.
    script: "MERLIN's closing call."
    trigger:
      when: { player_in_zone: "RETURN" }
      message: "MERLIN: Springfield, Merlin. Marshal's expecting you. Fly the needles."
      seconds: 15
