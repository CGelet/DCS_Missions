# HIGH TIDE chapter 2: night, fast attack craft laying mines off Poti. Source of truth;
# `python -m dcsmb build` renders hangar/ht_2_minelayers/.
#
# Story device: hunting small boats in the dark. Three Tarantul-class missile boats are laying mines in
# one of Poti's two approach channels (the northern one off the Rioni mouth, or the southern one off
# Kulevi). The sim rolls which; DARKSTAR only has "small surface contacts near Poti". Any boat that
# reaches the MINEFIELD zone with you not having killed it gets its mines down. 40%: a fourth boat
# runs south toward Batumi as a decoy. All positions open water (Nominatim).

meta:
  id: ht_2_minelayers
  title: "Operation HIGH TIDE"
  subtitle: "Minelayers in the Dark"
  theater: caucasus
  role: "Anti-ship"
  date: 2038-05-13
  start_time: "22:10"
  weather:
    temperature_c: 13
    wind_from_deg: 90
    wind_kts: 6
    clouds: "Clear, bright moon"
    visibility: "15 km"
    qnh_inhg: 30.01
  blue_country: USA
  red_country: Russia

narrative:
  operation: "HIGH TIDE"
  backstory: |
    Springfield's tape showed landing ships at Ochamchire. Two nights later, Georgian fishermen
    coming home to Poti saw something worse: fast boats with no lights, running slowly in lines across
    the harbour approaches and dropping things off their sterns.

    If Poti's approaches are mined, nothing gets in or out of Georgia's biggest port, and the coalition
    can't land so much as a crate there. The boats have to be stopped before they finish tonight.
    They're small, fast and dark, and the Stennis has two Hornets on deck with Mavericks.
  characters:
    - name: "CAPT Lena \"MERLIN\" Ostrowski"
      role: "CAG, aboard the Stennis"
    - name: "LCDR Sam \"PRISM\" Haddad"
      role: "Strike group intelligence officer"
    - name: "DARKSTAR"
      role: "E-2C Hawkeye"
    - name: "Poti Coast Guard"
      role: "Georgian patrol boat watching the harbour mouth"
    - name: "Springfield 1-1 / 1-2"
      role: "You and your wingman, F/A-18C Hornets"
  hook: |
    "Every mine they put in the water tonight is a week of minesweeping we don't have. Get there
    while they're still laying." MERLIN, launch brief
  outcomes:
    success: |
      Three boats burn off Poti, and the channel they were seeding has only the first few mines in it.
      Georgian divers mark them by noon. The port stays open.
    partial: |
      The boats are stopped, but they finish their first line. Poti's northern channel is closed for
      a week while sweepers work it. Ships still get in by the other channel.
    failure: |
      The boats finish both lines and run home. Poti is closed. The coalition's supplies for Georgia
      now come through Batumi, three times further from where they're needed.

situation: |
  Night, a bright moon, calm sea. Small fast boats are laying mines in one of Poti's two approach channels:
  the northern one, off the Rioni mouth, or the southern one, off Kulevi. DARKSTAR has intermittent
  small surface contacts near Poti but can't hold them. A Georgian coast guard boat is in the harbour
  mouth: it's friendly. Find the minelayers with the radar and the pod, and sink them before they
  finish a line.

objectives:
  primary: "Sink the minelaying boats before they finish laying."
  secondary: "No hits on the Georgian coast guard boat or fishing traffic."
  tertiary: "Recover both aircraft aboard the Stennis."

roe: |
  Weapons free on unlit military vessels moving in Poti's approach channels. Positive identification
  on the pod before every shot: the Georgian coast guard boat (lit) and fishing boats are in the area.

threats:
  - name: "Fast attack craft"
    kind: aaa
    intel: suspected
    lat: 42.1600
    lon: 41.5800
    area_km: 12
    range_km: 4
    notes: "Probably Tarantul-class. 76 mm gun, 30 mm Gatlings and SA-N-5 shoulder-launched SAMs. Stay above 4,000 ft."
  - name: "Georgian coast guard (FRIENDLY)"
    kind: hazard
    lat: 42.1520
    lon: 41.6300
    range_km: 0.5
    notes: "Patrol boat in the harbour mouth, lights on. Don't shoot anything near it without a positive ID."

comms:
  # F/A-18C: radio 1 = COMM1, radio 2 = COMM2. Radio 1 channel 1 is always the flight frequency.
  - { name: "Springfield (inter-flight)", freq: "256.000 AM", radio: 1, channel: 1 }
  - { name: "DARKSTAR (E-2C)", freq: "251.000 AM", radio: 1, channel: 2, notes: "Answers the F5 AWACS menu" }
  - { name: "TEXACO 1 (S-3B)", freq: "253.000 AM", radio: 1, channel: 3, notes: "TACAN 60Y" }
  - { name: "Mother (Stennis)", freq: "127.500 AM", radio: 2, channel: 1, notes: "TACAN 74X, ICLS 1. Answers the ATC menu" }
  - { name: "MERLIN, PRISM, Poti Coast Guard", freq: "256.000 AM", notes: "Scripted calls (on-screen text); they don't answer the radio menu" }

ships:
