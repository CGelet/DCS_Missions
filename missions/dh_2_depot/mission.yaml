# DARK HORSE chapter 2: the missile brigade's depot, at dusk under a low ceiling. Source of truth;
# `python -m dcsmb build` renders hangar/dh_2_depot/.
#
# Story device: weather you have to go under. Real DCS cloud (Overcast 4, base 4,500 ft) over the
# depot, so laser bombs from above are out: dive under the deck with Mk-83s and the gun. The sim rolls
# whether the depot's guns are Shilkas or a Tunguska, and 30% that Gudauta's MiG-29s come down at dusk.
# Depot in farmland west of Gali on a tertiary road (OSM), away from the town.

meta:
  id: dh_2_depot
  title: "Operation DARK HORSE"
  subtitle: "Under the Deck"
  theater: caucasus
  role: "Strike"
  date: 2038-06-04
  start_time: "20:05"
  weather:
    temperature_c: 19
    wind_from_deg: 220
    wind_kts: 12
    clouds: "Overcast 4,500 ft, tops 11,000 ft, drizzle"
    visibility: "8 km under the cloud, dusk"
    qnh_inhg: 29.86
    cloud_preset: Overcast4
    cloud_base_ft: 4500
  blue_country: USA
  red_country: Russia

narrative:
  operation: "DARK HORSE"
  backstory: |
    The launcher in the hills is gone, and Capt. Lomidze has an answer to her question: there are
    more. A captured driver says the brigade has four launchers and one place they all go back to for
    fuel and missiles, a depot in the orchards west of Gali. Kill the depot and the launchers run dry.

    The catch is the weather. A front came in off the sea this afternoon and parked over Abkhazia: cloud
    at 4,500 ft, drizzle under it, and dusk. Laser bombs from above are no good. Pontiac flight is going
    under the deck.
  characters:
    - name: "CDR Kofi \"ANVIL\" Mensah"
      role: "Detachment commander at Senaki-Kolkhi"
    - name: "Capt. Tamar Lomidze"
      role: "Georgian Air Force intelligence liaison"
    - name: "OVERLORD"
      role: "E-3 AWACS"
    - name: "Pontiac 1-1 / 1-2"
      role: "You and your wingman, F/A-18C Hornets"
  hook: |
    "Under the cloud, in the rain, at dusk, with guns. I wouldn't ask if it didn't matter. It matters."
    ANVIL, 1930 brief
  outcomes:
    success: |
      The depot burns all night, and Gali can see the glow from the orchards. With no fuel and no reloads,
      the brigade's launchers go quiet for three days.
    partial: |
      Half the depot burns. The brigade gets the rest out in trucks before dawn. The launchers keep
      firing, less often.
    failure: |
      The depot is untouched. The next morning a Scud lands in Senaki's dispersal area.

situation: |
  The Scud brigade's fuel and missile depot is in farmland 6 km west of Gali, beside a country road:
  fuel bowsers, missile transporters and a crane truck under nets. Overcast at 4,500 ft with drizzle
  and dusk light: attacks have to be flown under the cloud. Expect anti-aircraft guns at the depot and
  possibly something better. Gudauta's MiG-29s have flown at dusk before.

objectives:
  primary: "Destroy the depot's fuel and missile vehicles."
  secondary: "Destroy the depot's air defence."
  tertiary: "Recover both aircraft to Kobuleti."

roe: |
  Weapons free on military vehicles at the depot. Nothing in Gali town or on the main road through it.
  Positive identification under the cloud on every pass.

threats:
  - name: "Depot air defence"
    kind: aaa
    intel: suspected
    lat: 42.6070
    lon: 41.6720
    area_km: 1
    range_km: 3
    notes: "Self-propelled guns at least. Under a 4,500 ft deck, every gun on the site can reach you."
  - name: "MiG-29s (Gudauta)"
    kind: air
    intel: possible
    lat: 43.1143
    lon: 40.5697
    range_km: 0
    notes: "They've flown at dusk twice this week. OVERLORD will call them."

comms:
  # F/A-18C: radio 1 = COMM1, radio 2 = COMM2. Radio 1 channel 1 is always the flight frequency.
  - { name: "Pontiac (inter-flight)", freq: "255.000 AM", radio: 1, channel: 1 }
  - { name: "OVERLORD (AWACS)", freq: "251.000 AM", radio: 1, channel: 2, notes: "Answers the F5 AWACS menu" }
  - { name: "Kobuleti Tower", freq: "133.000 AM", radio: 2, channel: 1, notes: "TACAN 67X, ILS 07 111.50. Base and recovery" }
  - { name: "Senaki Tower (divert)", freq: "132.000 AM", radio: 2, channel: 2, notes: "TACAN 31X" }
  - { name: "ANVIL, Capt. Lomidze", freq: "255.000 AM", notes: "Scripted calls (on-screen text); they don't answer the radio menu" }

flights:
  - callsign: "Pontiac 1"
    aircraft: FA_18C_hornet
    count: 2
    player: true
    base: Kobuleti
    start: cold
    radio1_mhz: 255.0
    loadout:
      1: AIM_9X_Sidewinder_IR_AAM
      2: BRU_33_with_2_x_Mk_83___1000lb_GP_Bomb_LD
      3: BRU_33_with_2_x_Mk_82Y___500lb_GP_Chute_Retarded_HD
      4: AN_ASQ_228_ATFLIR___Targeting_Pod
      5: FPU_8A_Fuel_Tank_330_gallons
      6: AIM_120C_5_AMRAAM___Active_Rdr_AAM
      7: BRU_33_with_2_x_Mk_82Y___500lb_GP_Chute_Retarded_HD
      8: BRU_33_with_2_x_Mk_83___1000lb_GP_Bomb_LD
      9: AIM_9X_Sidewinder_IR_AAM
    loadout_summary: "4× Mk-83, 4× Mk-82 Snakeye (retarded), 2× AIM-9X, 1× AIM-120C, ATFLIR, 1× 330 gal tank, 578 rounds 20 mm"
    bingo_lbs: 4000
    joker_lbs: 6000
    waypoints:
      - { name: "COAST",     lat: 42.1500, lon: 41.6000, alt_ft: 3500, kts: 420, eta: "20:22", zone_km: 4 }
      - { name: "ANAKLIA",   lat: 42.4000, lon: 41.5800, alt_ft: 1500, kts: 450, eta: "20:26", agl: true, zone_km: 4 }
      - { name: "IP ORCHARD", lat: 42.5600, lon: 41.6300, alt_ft: 1500, kts: 450, eta: "20:28", agl: true, zone_km: 3 }
      - { name: "DEPOT",     lat: 42.6050, lon: 41.6700, alt_ft: 3500, kts: 480, eta: "20:29", action: bomb, zone_km: 3 }
      - { name: "OUT",       lat: 42.4500, lon: 41.3500, alt_ft: 4000, kts: 450, eta: "20:33", zone_km: 5 }
    land: Kobuleti

target:
  name: "Missile brigade depot"
  lat: 42.6050
  lon: 41.6700
  groups: ["Depot"]
  kill_pct: 70
  description: "Fuel bowsers, missile transporters and a crane truck under nets in an orchard beside a country road, 6 km west of Gali."
  dmpi: "Snakeyes in a level pass at 500 ft on the fuel line, Mk-83s in a shallow dive on the transporters. Guns on whatever's left."

units:
  # Ground truth. Pilots never see this section.
  - name: "Depot"
    coalition: red
    type: [ATZ_10, ATZ_10, ATZ_10, MAZ_6303, MAZ_6303, Ural_4320_31, ZiL_131_APA_80]
    lat: 42.6050
    lon: 41.6700
    heading: 30
  - name: "Depot Shilkas"
    coalition: red
    type: [ZSU_23_4_Shilka, ZSU_23_4_Shilka]
    lat: 42.6070
    lon: 41.6720
    heading: 200
    late_activation: true
  - name: "Depot Tunguska"
    coalition: red
    type: [X_2S6_Tunguska]
    lat: 42.6070
    lon: 41.6720
    heading: 200
    late_activation: true

support:
  - kind: awacs
    callsign: "OVERLORD"
    aircraft: E_3A
    coalition: blue
    lat: 42.0000
    lon: 41.3000
    alt_ft: 30000
    heading: 330
    leg_nm: 25
    freq_mhz: 251.0
  # Red: director only
  - kind: intercept
    callsign: "Gudauta Dusk Pair"
    aircraft: MiG_29S
    coalition: red
    count: 2
    base: Gudauta
    late_activation: true

variants:
  - name: "Depot guns"
    options:
      - label: "Two Shilkas"
        activate: ["Depot Shilkas"]
        when: { time_after: 5 }
      - label: "A Tunguska"
        activate: ["Depot Tunguska"]
        when: { time_after: 5 }

storyboard:
  - phase: "Launch"
    time: "20:05"
    waypoints: ["COAST"]
    brief: |
      Cold start at Kobuleti in the drizzle. Stay under the cloud: north along the coast at 3,500 ft.
      Set the bomb fuzing for low-level before you go.
    script: "The depot's guns are rolled at start. ANVIL checks in."
    trigger:
      when: { time_after: 10 }
      message: "ANVIL: Pontiac, Anvil. Weather's as bad as briefed. Stay under it and stay together."
      seconds: 15

  - phase: "Low Under the Deck"
    time: "20:26"
    waypoints: ["ANAKLIA", "IP ORCHARD"]
    brief: |
      Coast in at Anaklia at 1,500 ft AGL and run north up the farmland to IP ORCHARD. The cloud is
      the ceiling; the ground is the floor.
    script: "30%: Gudauta's MiG-29s launch as you coast in."
    trigger:
      when: { player_in_zone: "ANAKLIA" }
      chance: 30
      activate: ["Gudauta Dusk Pair"]
      message: "OVERLORD: Pontiac, Overlord. Two contacts departing Gudauta, southeast bound, above the weather. Hostile."
      seconds: 20

  - phase: "The Depot"
    time: "20:29"
    waypoints: ["DEPOT"]
    notes: "Ask the room: Snakeyes level at 500 ft, or Mk-83s in a dive from just under the cloud. Which first, and why?"
    brief: |
      Lead runs in level at 500 ft with Snakeyes along the fuel line; wingman follows 30 seconds behind
      with Mk-83s in a shallow dive. One pass each if you can. The guns will be awake after the first.
    script: "Depot 70% destroyed: success (flag 10)."
    trigger:
      when: { target_destroyed: true }
      set_flag: 10
      message: "CAPT. LOMIDZE: Pontiac, Lomidze. Gali police report explosions in the orchards, lots of them. That's it."
      seconds: 20

  - phase: "Home"
    time: "20:33"
    waypoints: ["OUT"]
    brief: |
      Out to sea southwest, climb through the cloud on instruments, and recover to Kobuleti on the ILS.
    script: "ANVIL's closing call."
    trigger:
      when: { player_in_zone: "OUT" }
      message: "ANVIL: Pontiac, Anvil. Feet wet. Kobuleti's at minimums. Fly the ILS."
      seconds: 15
