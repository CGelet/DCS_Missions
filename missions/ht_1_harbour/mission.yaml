    aircraft: FA_18C_hornet
    count: 2
    player: true
    base: "Stennis Group"
    start: cold
    radio1_mhz: 256.0
    loadout:
      1: AIM_9X_Sidewinder_IR_AAM
      2: LAU_115_2_LAU_127_AIM_120C
      3: FPU_8A_Fuel_Tank_330_gallons
      4: AN_ASQ_228_ATFLIR___Targeting_Pod
      6: AIM_120C_5_AMRAAM___Active_Rdr_AAM
      7: FPU_8A_Fuel_Tank_330_gallons
      8: LAU_115_2_LAU_127_AIM_120C
      9: AIM_9X_Sidewinder_IR_AAM
    loadout_summary: "5× AIM-120C, 2× AIM-9X, ATFLIR, 2× 330 gal tanks, 578 rounds 20 mm"
    bingo_lbs: 4500
    joker_lbs: 6500
    waypoints:
      - { name: "MARSH",     lat: 42.2000, lon: 41.1500, alt_ft: 20000, kts: 420, eta: "05:42", zone_km: 5 }
      - { name: "DESCEND",   lat: 42.5500, lon: 41.2000, alt_ft: 3000,  kts: 450, eta: "05:48", zone_km: 5 }
