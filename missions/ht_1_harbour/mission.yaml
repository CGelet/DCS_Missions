      - { name: "KODORI",    lat: 42.7900, lon: 41.1200, alt_ft: 4000,  kts: 480, eta: "05:54", zone_km: 2.5 }
      - { name: "FEET WET",  lat: 42.5500, lon: 40.9500, alt_ft: 20000, kts: 450, eta: "05:58", zone_km: 6 }
    land: "Stennis Group"

target:
  name: "Ochamchire harbour"
  lat: 42.7100
  lon: 41.4550
  zone_m: 50
  description: "A small harbour with a quay along its north side. Count hulls, bow doors, and vehicles on the quay."
  dmpi: "ATFLIR recording from 6 nm out, wide field of view on the quay, through the overflight."

zones:
  - { name: "PHOTO LOW", lat: 42.7100, lon: 41.4550, radius_km: 1.5 }

units:
  # Ground truth. Pilots never see this section.
  - name: "Quay Osa"
    coalition: red
    type: [Osa_9A33_ln]
    lat: 42.7180
    lon: 41.4720
    heading: 220
  - name: "Quay Guns"
    coalition: red
    type: [ZU_23_Emplacement, ZU_23_Emplacement]
    lat: 42.7130
    lon: 41.4650
    heading: 220

support:
  - kind: awacs
    callsign: "DARKSTAR"
    aircraft: E_2C
    coalition: blue
    lat: 42.0000
    lon: 40.9000
    alt_ft: 25000
    heading: 30
    leg_nm: 25
    freq_mhz: 251.0
  - kind: tanker
    callsign: "TEXACO 1"
    aircraft: S_3B_Tanker
    coalition: blue
    lat: 41.9000
    lon: 41.1200
    alt_ft: 8000
    heading: 30
    leg_nm: 15
    kts: 260
    freq_mhz: 253.0
    tacan: { channel: "60Y", callsign: "TEX" }
  # Red: director only
  - kind: intercept
    callsign: "Gudauta Alert"
    aircraft: MiG_29S
    coalition: red
    count: 2
    base: Gudauta
    late_activation: true

variants:
  - name: "Where the landing ships are"
    options:
      - label: "Alongside the quay in the harbour"
        activate: ["Landing Ships Alongside"]
        when: { time_after: 5 }
      - label: "Out at the anchorage off the Kodori mouth"
        activate: ["Landing Ships Anchorage"]
        when: { time_after: 5 }

storyboard:
  - phase: "Launch"
    time: "05:20"
    waypoints: ["MARSH"]
    brief: |
      Cold start on the Stennis at dawn. Launch, join at MARSH, and climb north to 20,000 ft. ATFLIR
      recording on before you descend.
    script: "Where the landing ships are is rolled at start (see variants). MERLIN checks in."
    trigger:
      when: { time_after: 10 }
      message: "MERLIN: Springfield, Merlin. Count everything, shoot nothing unless it shoots first, and come home."
      seconds: 15

  - phase: "The Run In"
    time: "05:48"
    waypoints: ["DESCEND"]
    brief: |
      Down to 3,000 ft over the water at DESCEND and accelerate. Approach the harbour from the
      southwest out of the haze.
    script: "40%: Gudauta's MiG-29s scramble when you start the descent."
    trigger:
      when: { player_in_zone: "DESCEND" }
      chance: 40
      activate: ["Gudauta Alert"]
      message: "DARKSTAR: Springfield, Darkstar. Pop-up group, two contacts, departing Gudauta, northwest five-zero, hostile."
      seconds: 20

  - phase: "Photo Pass"
    time: "05:51"
    waypoints: ["PHOTO", "KODORI"]
    notes: "Ask the room: the MiGs are up as you start the pass. Abort the photo or finish it?"
    brief: |
      One pass over the harbour below 5,000 ft at 480 kt, pod on the quay. Then north along the coast
      to look at the anchorage off the Kodori mouth, and out to sea.
    script: "Passing PHOTO LOW below 5,000 ft logs the photo (flag 30)."
    trigger:
      when: { player_in_zone: "PHOTO LOW", player_below_ft: 5000 }
      set_flag: 30
      message: "PRISM: Springfield, Prism. Copy photo pass complete. Get that tape home."
      seconds: 15

  - phase: "Home"
    time: "05:58"
    waypoints: ["FEET WET"]
    brief: |
      Climb out over the water to 20,000 ft and recover aboard the Stennis. TEXACO is overhead if
      you're short.
    script: "On deck after the photo pass completes the mission (flag 10)."
    trigger:
      when: { player_below_ft: 150, player_slower_kts: 40, flag: 30 }
      set_flag: 10
      message: "PRISM: Springfield, Prism. Tape's coming down to the shop. Thank you."
      seconds: 15
