      - { lat: 41.9500, lon: 41.1900 }
      - { lat: 42.0500, lon: 41.2800 }
    tacan: { channel: "74X", callsign: "STN" }
    icls: 1
    freq_mhz: 127.5
  # Red: director only
  - name: "Harbour Patrol"
    coalition: red
    type: [ALBATROS]
    lat: 42.7000
    lon: 41.4200
    heading: 300
    speed_kts: 6
    route:
      - { lat: 42.7400, lon: 41.3600 }
      - { lat: 42.7000, lon: 41.4200 }
