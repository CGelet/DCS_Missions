# HIGH TIDE chapter 1: eyes on Ochamchire. Source of truth; `python -m dcsmb build` renders hangar/ht_1_harbour/.
#
# Story device: a recce where the answer matters more than the shooting. Fly over the harbour low
# enough for the pod to count hulls, and get home with the tape. The sim rolls where the landing ships
# are (alongside in the harbour, or already out at the anchorage off the Kodori mouth), and 40% that
# Gudauta's MiG-29s come up while you're there. Success is the photo pass plus a trap.
# Harbour, anchorage and carrier positions checked as open water against OSM (Nominatim).

meta:
  id: ht_1_harbour
  title: "Operation HIGH TIDE"
  subtitle: "Eyes on Ochamchire"
  theater: caucasus
  role: "Reconnaissance"
  date: 2038-05-11
  start_time: "05:20"
  weather:
    temperature_c: 15
    wind_from_deg: 30
    wind_kts: 8
    clouds: "Few at 3,000 ft, haze on the coast"
    visibility: "12 km at dawn"
    qnh_inhg: 29.95
  blue_country: USA
  red_country: Russia

narrative:
  operation: "HIGH TIDE"
  backstory: |
    A month after the Roki tunnel, the war moved to the coast. Fishing boats out of Anaklia have been
    reporting grey ships at Ochamchire all week: big ones, with bow doors. Ochamchire's harbour is
    too small for a navy, but it isn't too small for landing ships, and the Georgian coast from Anaklia
    to Poti is flat, sandy and forty minutes away.

    The Stennis came back into the Black Sea three days ago. Before anyone plans anything, the
    strike group needs to know what is in that harbour. Nobody has a picture newer than a week. Today,
    Springfield flight gets one.
  characters:
    - name: "CAPT Lena \"MERLIN\" Ostrowski"
      role: "Carrier Air Wing commander (CAG), aboard the Stennis"
    - name: "LCDR Sam \"PRISM\" Haddad"
      role: "Strike group intelligence officer"
    - name: "DARKSTAR"
      role: "E-2C Hawkeye from the Stennis"
    - name: "Springfield 1-1 / 1-2"
      role: "You and your wingman, F/A-18C Hornets"
  hook: |
    "I don't need you to sink anything. I need you to count. And then I need you to come back so
    I can see what you counted." PRISM, 0430 brief
  outcomes:
    success: |
      Springfield's tape is on PRISM's screen by 0700. Four landing ships, two patrol boats and a
      lot of trucks on the quay. The strike group stops wondering and starts planning.
    partial: |
      The tape comes back, but the pass was high and fast and the haze ate half of it. PRISM counts
      "at least two" landing ships. The planning starts on a guess.
    failure: |
      Nothing usable comes back. The strike group goes into the next week blind, and the landing
      force gets another week to get ready.

situation: |
  Ochamchire, in red-held Abkhazia, 120 km north of the carrier. Fishing boats report landing ships in
  the harbour this week; nobody has seen them from the air. The harbour is small and shallow, with a
  quay along its north side; the Kodori river mouth and its anchorage are 25 km up the coast to the northwest. Expect point
  air defence at the harbour and a patrol boat. Gudauta has MiG-29s on alert, 90 km northwest.

objectives:
  primary: "Fly the photo pass over Ochamchire harbour below 5,000 ft and bring the tape home."
  secondary: "Get a look at the anchorage off the Kodori mouth on the way out."
  tertiary: "Recover both aircraft aboard the Stennis."

roe: |
  Self-defence only. Weapons free on anything that engages you, and on aircraft DARKSTAR declares
  hostile. No strikes on the harbour today: we're looking, not shooting.

threats:
  - name: "Harbour air defence"
    kind: sam
    intel: suspected
    lat: 42.7150
    lon: 41.4700
    area_km: 3
    range_km: 10
    notes: "Something short-range will be guarding the quay. An SA-8 was seen there last year."
  - name: "Patrol boat"
    kind: aaa
    intel: possible
    lat: 42.7000
    lon: 41.4300
    area_km: 5
    range_km: 4
    notes: "Grisha-class corvette or smaller. Guns and SA-N-4."
  - name: "MiG-29s (Gudauta)"
    kind: air
    intel: possible
    lat: 43.1143
    lon: 40.5697
    range_km: 0
    notes: "Alert pair. DARKSTAR will call them if they launch."

comms:
  # F/A-18C: radio 1 = COMM1, radio 2 = COMM2. Radio 1 channel 1 is always the flight frequency.
  - { name: "Springfield (inter-flight)", freq: "256.000 AM", radio: 1, channel: 1 }
  - { name: "DARKSTAR (E-2C)", freq: "251.000 AM", radio: 1, channel: 2, notes: "Answers the F5 AWACS menu" }
  - { name: "TEXACO 1 (S-3B)", freq: "253.000 AM", radio: 1, channel: 3, notes: "TACAN 60Y" }
  - { name: "Mother (Stennis)", freq: "127.500 AM", radio: 2, channel: 1, notes: "TACAN 74X, ICLS 1. Answers the ATC menu" }
  - { name: "MERLIN, PRISM", freq: "256.000 AM", notes: "Scripted calls (on-screen text); they don't answer the radio menu" }

