storyboard:
  - phase: "Step and Marshal"
    time: "13:00"
    waypoints: ["MARSHAL"]
    brief: |
      Cold start at Nellis, two-ship. Load the JDAM targets before taxi: three per jet, one per vehicle,
      plus a spare on the biggest. Depart northwest to MARSHAL at 20,000 ft and hold until 13:38.
    script: "WREN opens the exercise; Uzi and Weasel are airborne from the start (spawned in the air near PUSH)."
    trigger:
      when: { time_after: 10 }
      message: "WREN: Dodge, Wren, white air with Wizard. Uzi and Weasel are on station. Push is one-three-four-zero."
      seconds: 15

  - phase: "Push"
    time: "13:40"
    waypoints: ["PUSH", "IP"]
    notes: "Ask the room: Uzi is engaged and the bandits are at 15 miles. Do the strikers press?"
    brief: |
      Cross PUSH at 13:40:00, 20,000 ft and 420 kt, accelerating to 450 kt. The TOT clock starts at
      PUSH. The aggressors launch when the package pushes; WIZARD will declare them.
    script: "Crossing PUSH sets flag 30 and launches Bandit 71 from the north."
    trigger:
      when: { player_in_zone: "PUSH" }
      set_flag: 30
      activate: ["Bandit 71"]
      message: "WIZARD: Package, Wizard. Group north, three-five miles, angels two-four, hot. Two contacts. Hostile. Uzi, commit."
      seconds: 20

  - phase: "Time on Target"
    time: "13:43"
    waypoints: ["TGT"]
    brief: |
      JDAMs from 20,000 ft inside the launch zone. The sim calls your TOT at TGT. Weasel will be busy with
      the SA-6; it'll be spiking you all the way in, but it won't shoot.
    script: "Target destroyed with an on-time TOT (flag 61) completes the event (flag 10). Late or early TOT with the target destroyed: partial (flag 20)."
    triggers:
      - when: { target_destroyed: true, flag: 61 }
        set_flag: 10
        message: "WREN: Dodge, Wren. Target complex destroyed, on time. Off target south."
        seconds: 15
      - when: { target_destroyed: true, flag_false: 61, time_since_flag: [30, 330] }
        set_flag: 20
        message: "WREN: Dodge, Wren. Target's down, but you weren't in the window. Off target south."
        seconds: 15

  - phase: "Egress and Recovery"
    time: "13:47"
    waypoints: ["EGRESS"]
    brief: |
      Off target to the south, climbing to 24,000 ft at 480 kt. Fence out at EGRESS and recover to Nellis
      (TACAN 12X), well west of R-4808N.
    script: "WREN closes the exercise at EGRESS."
    trigger:
      when: { player_in_zone: "EGRESS", flag: 30 }
      message: "WREN: Dodge, Wren. Fence out. Mass debrief at sixteen-thirty. Bring your tapes."
      seconds: 15
