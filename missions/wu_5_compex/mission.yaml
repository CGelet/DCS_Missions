storyboard:
  - phase: "Start and Join"
    time: "09:30"
    waypoints: []
    brief: |
      Cold start at Kutaisi, two-ship. Check the JDAM targets are loaded: three per jet, one per
      vehicle. Depart east and climb to 20,000 ft for PUSH. Uzi and Weasel check in on package common.
    script: "WREN opens the checkride; Uzi and Weasel are airborne from the start (spawned in the air near PUSH)."
    trigger:
      when: { time_after: 10 }
      message: "WREN: Colt, Wren. Checkride's on. Uzi and Weasel are checking in on package common. Push on time."
      seconds: 15

  - phase: "Push"
    time: "09:58"
    waypoints: ["PUSH", "IP"]
    notes: "Ask the strike lead what the TOT plan was if Weasel hadn't checked in."
    brief: |
      Cross PUSH at 20,000 ft and 420 kt. That starts the TOT clock: 3:20 to the target. The
      aggressors will launch when the package pushes; Uzi will call them.
    script: "Crossing PUSH sets flag 30 and launches Bandit 61 from the north."
    trigger:
      when: { player_in_zone: "PUSH" }
      set_flag: 30
      activate: ["Bandit 61"]
      message: "MAGIC: Package, Magic. Pop-up group, two contacts, north three-five miles, angels one-eight, hot. Bandit, bandit. Uzi, commit."
      seconds: 20

  - phase: "Time on Target"
    time: "10:02"
    waypoints: ["TGT"]
    brief: |
      JDAMs from 20,000 ft inside the LAR. The sim calls your TOT at TGT. Weasel will have dealt with
      the SA-8 by then; if it's still radiating, release and get out.
    script: "Target destroyed with an on-time TOT (flag 61) completes the checkride (flag 10). Late or early TOT with the target destroyed: partial (flag 20)."
    triggers:
      - when: { target_destroyed: true, flag: 61 }
        set_flag: 10
        message: "WREN: Colt, Wren. Target destroyed, on time. Get out of there."
        seconds: 15
      - when: { target_destroyed: true, flag_false: 61, time_since_flag: [30, 330] }
        set_flag: 20
        message: "WREN: Colt, Wren. Target's down, but you weren't in the window. Egress."
        seconds: 15

  - phase: "Egress"
    time: "10:06"
    waypoints: ["EGRESS"]
    brief: |
      Off target to the northwest, climbing to 24,000 ft at 480 kt. Fence out at EGRESS and recover
      to Kutaisi.
    script: "WREN closes the checkride at EGRESS."
    trigger:
      when: { player_in_zone: "EGRESS", flag: 30 }
      message: "WREN: Colt, Wren. Fence out. I'll see the package in the big room."
      seconds: 15
