# WORK-UPS event 5: graduation composite exercise. Source of truth; `python -m dcsmb build` renders hangar/wu_5_compex/.
#
# Training: everything briefed, nothing random. A small package: you lead the strike two-ship with
# GBU-38s, Uzi 1 escorts (AI), Weasel 1 does SEAD (AI). Red: an emitting, weapons-hold SA-8 at the
# target and two live-fire F-5E aggressors that launch from the north when you cross PUSH. Time on
# target is timed from PUSH (±30 s). Success needs the target destroyed AND the TOT in the window.
# Target set: hulks on open ground 11 km SW of Khashuri; no buildings or villages within 500 m (OSM Overpass).

meta:
  id: wu_5_compex
  title: "CHECKRIDE"
  subtitle: "Graduation Composite Exercise"
  category: training
  theater: caucasus
  role: "Strike (package)"
  date: 2026-01-30
  start_time: "09:30"
  weather:
    temperature_c: 2
    wind_from_deg: 280
    wind_kts: 14
    clouds: "Scattered 6,000 ft, broken 12,000 ft over the ridge"
    visibility: "20 km"
    qnh_inhg: 30.00
    cloud_preset: Scattered2
    cloud_base_ft: 6000
  blue_country: USA
  red_country: Russia

training:
  syllabus: "Det work-ups, event COMPEX-1 (checkride)"
  rules:
    - "Package of three flights on one timeline. You lead the strike (Colt 1). Uzi 1 escorts, Weasel 1 suppresses."
    - "Time on target is 3:20 after PUSH, ±30 s. A strike outside the window is graded as a miss, even if the bombs hit."
    - "The range SA-8 at the target radiates on weapons hold. Weasel 1 is cleared to kill it; you are not."
    - "The two F-5E aggressors are live-fire: DCS has no simulated-kill mode. They're Uzi's problem first, yours if they leak."
    - "Minimum 15,000 ft MSL over the target for the JDAM release. No releases outside TARGET AREA."
    - "Bingo 4,500 lb to Kutaisi."
  knock_it_off: |
    Anyone in the package calls "Knock it off" for a midair risk, a hung store or a leaker on your
    tail with your bombs still on. Strike flight turns west at 20,000 ft, master arm SAFE, and waits
    for WREN on det common.
  special_subjects:
    - "Push timing: you control the TOT with speed after PUSH, not with turns over the target."
    - "If the escort is busy: who calls the leaker, and does the strike abort or press?"
    - "GBU-38 on trucks: one bomb per vehicle, release inside the LAR, don't wait for the pod."
    - "Egress: the F-5s will be behind you. Speed and altitude home."
  grade_sheet:
    - { item: "Package brief execution", standard: "Crosses PUSH within 1 minute of Uzi and Weasel." }
    - { item: "TOT", standard: "Reaches the target within ±30 s of 3:20 after PUSH." }
    - { item: "Target", standard: "The target set is destroyed by the strike flight's JDAMs." }
    - { item: "Leaker defence", standard: "No strike aircraft lost to the aggressors." }
    - { item: "Egress and recovery", standard: "Fenced out, both jets recovered to Kutaisi above bingo." }
  debrief_focus:
    - "Timeline from PUSH to TOT: where did you lose or gain time?"
    - "The package comms: who called what, and when."
    - "Bomb hits against the DMPIs."

narrative:
  operation: "CHECKRIDE"
  backstory: |
    This is the last event of work-ups and the one WREN signs the whole card on. It puts everything
    from the last three weeks into one sortie: a package that has to arrive together, an emitter
    that has to be suppressed, aggressors that want to break it up, and a target that has to be
    hit on time.

    The target set is a line of old vehicles in open fields southwest of Khashuri, standing
    in for a fuel and ammunition point. The emitter is the range's SA-8, and the aggressors are the
    contract F-5 pilots the det will fight in February. You lead the strike.
  characters:
    - name: "LCDR Ana \"WREN\" Castellano"
      role: "Detachment training officer, grading the checkride from MAGIC"
    - name: "MAGIC"
      role: "E-3 AWACS"
    - name: "Uzi 1"
      role: "Two F/A-18C, escort (AI)"
    - name: "Weasel 1"
      role: "Two F/A-18C with HARMs, SEAD (AI)"
    - name: "Bandit 61"
      role: "Two F-5E aggressors from the north"
    - name: "Colt 1-1 / 1-2"
      role: "You and your wingman, strike flight with GBU-38s"
  hook: |
    "I'm not grading the bombs. I'm grading whether the bombs land when you said they would,
    with everyone still alive." WREN, checkride brief
  outcomes:
    success: |
      Complete. Bombs on target inside the window, nobody lost. WREN signs the work-ups card in front
      of the whole detachment, and you're cleared for the February exercise.
    partial: |
      Partial: re-fly items. The target is destroyed, but outside the TOT window, or a strike jet
      was lost to a leaker. You'll re-fly the checkride with the next package.
    failure: |
      Incomplete: re-fly the checkride. The target is still standing. WREN debriefs the timeline
      line by line.

situation: |
  Strike two-ship from Kutaisi with GBU-38s against a simulated fuel and ammunition point in open fields southwest of
  Khashuri. Uzi 1 (escort) and Weasel 1 (SEAD) launch with you and
  push together from PUSH, 43 km west of the target. TOT is 3:20 after PUSH. A weapons-hold SA-8
  sits at the target; two live-fire F-5E aggressors come from the north when the package pushes.

objectives:
  primary: "Destroy the target set with JDAMs inside the TOT window."
  secondary: "Lose no strike aircraft to the aggressors."
  tertiary: "Recover both jets to Kutaisi above bingo."

roe: |
  GBU-38s on the target vehicles inside TARGET AREA only. Air-to-air against the aggressors after
  MAGIC calls them hostile. The SA-8 is Weasel's: strike flight doesn't engage it.

threats:
  # Training: the players, exactly as they'll play
  - name: "Range SA-8 at the target (weapons hold)"
    kind: sam
    lat: 41.9580
    lon: 43.4800
    range_km: 10
    notes: "Live radar, weapons hold. Weasel 1 is cleared to kill it."
  - name: "Bandit 61: two F-5E (live-fire)"
    kind: air
    lat: 42.3500
    lon: 43.5500
    range_km: 0
    notes: "Launch from the north when the package crosses PUSH. AIM-9 and guns."

comms:
