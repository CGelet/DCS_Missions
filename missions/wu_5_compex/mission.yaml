  - { name: "Colt (inter-flight)", freq: "254.000 AM", radio: 1, channel: 1, notes: "WREN monitors here" }
  - { name: "MAGIC (AWACS)", freq: "251.000 AM", radio: 1, channel: 2, notes: "Answers the F5 AWACS menu" }
  - { name: "Package common", freq: "262.000 AM", radio: 1, channel: 3, notes: "Uzi and Weasel check in here" }
  - { name: "Kutaisi Tower", freq: "134.000 AM", radio: 2, channel: 1, notes: "TACAN 44X" }
  - { name: "WREN, MAGIC, Uzi, Weasel", freq: "262.000 AM", notes: "Scripted calls (on-screen text)" }

