    lat: 42.9500
    lon: 39.7000
    heading: 240
    speed_kts: 25
    route:
      - { lat: 42.8000, lon: 39.3500 }
      - { lat: 42.6500, lon: 39.0000 }
    tacan: { channel: "74X", callsign: "STN" }
    icls: 1
    freq_mhz: 127.5

