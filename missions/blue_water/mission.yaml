# Operation BLUE WATER: fleet defense from the carrier. Source of truth; `python -m dcsmb build` renders hangar/blue_water/.
#
# Story device: the threat you can't see yet, and gas you can't count on. You launch off a moving
# carrier, tank, and hold a CAP until the raid shows up. The sim rolls the raid's axis (over the
# water from Anapa, or over the mountains from Maykop), whether Flankers sweep ahead of it, and
# whether the big-wing tanker is still there when you arrive. You recover aboard at last light.
#
# Sea positions checked against OpenStreetMap (no land at any carrier, CAP or tanker point).

meta:
  id: blue_water
  title: "Operation BLUE WATER"
  subtitle: "Hold the Line at Sea"
  theater: caucasus
  role: "Fleet defense"   # mission type: the hangar filters on it
  date: 2026-03-20
  start_time: "16:40"
  weather:
    temperature_c: 10
    wind_from_deg: 240
    wind_kts: 14
    clouds: "Few 5,000 ft, scattered 18,000 ft"
    visibility: "20+ km, sun low in the west"
    qnh_inhg: 29.95
  blue_country: USA
  red_country: Russia

narrative:
  operation: "BLUE WATER"
  backstory: |
    With the Gumista holding, the coalition moved the Stennis strike group into the
    eastern Black Sea to put fighters over Sukhumi around the clock. The answer from
    the north was always going to come by air. Overnight, two Tu-22M3 Backfires moved
    forward. Each carries a Kh-22 that can hit a carrier from 300 km away.

    Nobody knows when they'll launch or which way they'll come. The fleet's best
    guess is dusk, with the sun in the defenders' eyes. Ford flight has the evening
    CAP north of the boat, and whatever happens up there, everyone has to be back
    aboard before the light goes.
  characters:
    - name: "Cmdr. Ray \"BISHOP\" Ortega"
      role: "CAG, Carrier Air Wing aboard USS John C. Stennis"
    - name: "DARKSTAR"
      role: "E-2C Hawkeye: the fleet's eyes, holding over the strike group"
    - name: "SHELL 1"
      role: "KC-135 (drogue) tanker on the track south of the boat"
    - name: "TEXACO 1"
      role: "S-3B recovery tanker overhead the carrier: little gas, always close"
    - name: "Ford 1-1 / 1-2"
      role: "You and your wingman, F-14B Tomcats with Phoenix"
  hook: |
    "They only have to get lucky once. You have to be lucky every time. Tonight, be
    lucky early." BISHOP, 1600 brief
  outcomes:
    success: |
      Both Backfires go into the sea north of the CAP before they reach launch range.
      The strike group never goes to general quarters. You trap on the last of the
      light, and BISHOP is waiting on the flight deck.
    partial: |
      One Backfire gets its missile off before you reach it. The escorts knock the
      Kh-22 down twelve miles from the boat. Nobody aboard sleeps tonight, and the
      admiral wants a second CAP station by morning.
    failure: |
      The raid reaches launch range untouched. Two Kh-22s come in at Mach 3, and one
      gets through the escorts' defences. The Stennis is still afloat but out of the
      fight, and so is the coalition's air cover over Sukhumi.

situation: |
  The Stennis strike group is operating 70 nm west of Sukhumi, steaming southwest into
  the wind. Long-range aviation has staged Tu-22M3 bombers within reach of the eastern
  Black Sea. Intelligence expects a raid this evening, most likely from the northwest
  over the water, but the mountains to the north can't be ruled out. Red fighters have
  escorted bombers before. Shell 1 provides big-wing gas south of the boat. Texaco 1,
  overhead Mother, carries a small amount for emergencies.

objectives:
  primary: "Destroy the bomber raid before it reaches the Kh-22 launch line."
  secondary: "Engage any fighters that threaten the CAP or the strike group."
  tertiary: "Recover both aircraft aboard the Stennis before last light."

roe: |
  Weapons free on any aircraft DARKSTAR declares hostile north of 43°10'N. Weapons
  tight on everything else. Civil traffic out of Sochi is possible: VID if in doubt.

threats:
  - name: "Tu-22M3 Backfire raid"
    kind: air
    intel: suspected
    lat: 44.1000
    lon: 38.6000
    area_km: 60
    range_km: 0
    notes: "Two bombers, Kh-22 (300 km). Expected from the northwest over the water. Must die before the launch line."
  - name: "Su-27 Flanker escort"
    kind: air
    intel: possible
    lat: 44.3000
    lon: 39.6000
    area_km: 40
    range_km: 0
    notes: "Escorts flew with the last raid in February. None seen staging this time."

comms:
  # F-14B: radio 1 is the pilot's ARC-159 (UHF), radio 2 the RIO's ARC-182 (V/UHF).
  - { name: "Ford (inter-flight)", freq: "250.000 AM", radio: 1, channel: 1 }
  - { name: "DARKSTAR (E-2C)", freq: "251.000 AM", radio: 1, channel: 2, notes: "Answers the F5 AWACS menu" }
  - { name: "SHELL 1 (KC-135 drogue)", freq: "252.000 AM", radio: 1, channel: 3, notes: "TACAN 51Y" }
  - { name: "TEXACO 1 (S-3B)", freq: "253.000 AM", radio: 1, channel: 4, notes: "TACAN 60Y. Recovery tanker" }
  - { name: "Mother (Stennis)", freq: "127.500 AM", radio: 2, channel: 1, notes: "TACAN 74X, ICLS 1. Answers the ATC menu" }
  - { name: "BISHOP, PADDLES", freq: "250.000 AM", notes: "Scripted calls (on-screen text); they don't answer the radio menu" }

