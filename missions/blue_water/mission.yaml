target:
  name: "Tu-22M3 bomber raid"
  lat: 43.7200
  lon: 39.1500
  area_km: 40
  groups: ["Raid West", "Raid North"]   # only the axis that was rolled counts
  description: "Two Tu-22M3 carrying Kh-22 anti-ship missiles. Kill them before the launch line, about 30 nm north of the CAP."
  dmpi: "Bombers first. Don't get drawn off by escorts unless they commit on you."

# Named trigger zones (beyond the player's waypoints)
zones:
  - { name: "LAUNCH LINE", lat: 43.7200, lon: 39.1500, radius_km: 30 }

