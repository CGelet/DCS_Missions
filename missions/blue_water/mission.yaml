      5: AIM_54C_Mk60
      6: AIM_54C_Mk60
      7: AIM_54C_Mk60
      8: Fuel_tank_300_gal_
      9: AIM_7M
      10: LAU_138_AIM_9M
    loadout_summary: "4× AIM-54C Phoenix, 2× AIM-7M, 2× AIM-9M, 2× 300 gal tanks"
    bingo_lbs: 4000
    joker_lbs: 6000
    waypoints:
      - { name: "TANKER",  lat: 42.7200, lon: 39.9000, alt_ft: 22000, kts: 300, eta: "16:58", zone_km: 15 }
      - { name: "CAP N",   lat: 43.4500, lon: 39.1000, alt_ft: 26000, kts: 350, eta: "17:12", action: cap, zone_km: 25 }
      - { name: "CAP S",   lat: 43.2500, lon: 39.4500, alt_ft: 26000, kts: 350, eta: "17:18", zone_km: 25 }
