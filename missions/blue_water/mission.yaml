variants:
  - name: "Raid axis"
    options:
      - label: "Over the water from Anapa"
        activate: ["Raid West"]
        when: { player_in_zone: "CAP N" }
        message: "DARKSTAR: Ford, Darkstar, new group, two contacts, high and fast, northwest over the water. Hostile. Commit."
        seconds: 20
      - label: "Over the mountains from Maykop"
        activate: ["Raid North"]
        when: { player_in_zone: "CAP N" }
        message: "DARKSTAR: Ford, Darkstar, new group, two contacts, high and fast, north, coming off the mountains. Hostile. Commit."
        seconds: 20

storyboard:
  - phase: "Cat Shot"
    time: "16:40"
    waypoints: []
    brief: |
      Cold start on the Stennis deck and launch into the wind. Mother is steaming 240
      at 25 knots. She won't be where you left her when you get back.
    script: "BISHOP sends you off; nothing hostile is airborne yet."
    trigger:
      when: { time_after: 15 }
      message: "BISHOP: Ford, CAG. Darkstar has nothing yet. That won't last. Go get your gas."
      seconds: 15

  - phase: "Find the Gas"
    time: "16:58"
    waypoints: ["TANKER"]
    notes: "Ask the room: if the big tanker isn't there, how much CAP time does Texaco's gas actually buy you?"
    brief: |
      Join Shell 1 on the track south of the boat (TACAN 51Y) and top off. Texaco 1
      overhead Mother (TACAN 60Y) is a backup with very little to give.
    script: |
      30%: Shell 1 goes RTB with a hydraulic failure six minutes into the mission, before
      you can reach it. Then Texaco is the only gas airborne.
    triggers:
      - when: { time_after: 360 }
        chance: 30
        deactivate: ["Shell 1"]
        set_flag: 30
        message: "DARKSTAR: Ford, Shell 1-1 is RTB with a hydraulic problem. Texaco overhead Mother is your only gas."
        seconds: 20
      - when: { player_in_zone: "TANKER", flag_false: 30 }
        message: "SHELL 1: Ford, Shell one-one, you're cleared pre-contact. Basket's out."
        seconds: 15

  - phase: "CAP Station"
    time: "17:12"
    waypoints: ["CAP N", "CAP S"]
    brief: |
      Hold the CAP between the two points at 26,000 ft, north of the boat. DARKSTAR
      will call the raid when it shows. Intel's best guess is northwest over the water.
    script: |
      Reaching CAP N starts the raid on the axis that was rolled; it's about 14 minutes
      from the launch line. 40%: two Su-27s sweep ahead of it.
    trigger:
      when: { player_in_zone: "CAP N" }
      chance: 40
      activate: ["Flanker Sweep"]
      message: "DARKSTAR: Ford, second group, two fast movers, Flankers, sweeping ahead of the raid. Hostile."
      seconds: 20

  - phase: "The Intercept"
    time: "17:20"
    waypoints: []
    brief: |
      Commit on DARKSTAR's call. Phoenix range is your friend: the bombers have to die
      before the launch line, about 30 nm north of the CAP.
    script: "The story branches: the bombers die first, or one of them reaches the launch line."
    triggers:
      - when: { target_destroyed: true }
        message: "DARKSTAR: Splash the Backfires. Picture clean. Ford, Darkstar, RTB Mother."
        set_flag: 10
        seconds: 20
      - when: { group_in_zone: ["Raid West", "LAUNCH LINE"] }
        message: "DARKSTAR: Vampire, vampire! Backfires launching, northwest, Kh-22s inbound to Mother!"
        set_flag: 20
        seconds: 20
      - when: { group_in_zone: ["Raid North", "LAUNCH LINE"] }
        message: "DARKSTAR: Vampire, vampire! Backfires launching, north, Kh-22s inbound to Mother!"
        set_flag: 20
        seconds: 20

  - phase: "Case I at Last Light"
    time: "18:05"
    waypoints: ["MARSHAL"]
    brief: |
      Back to Mother: TACAN 74X, ICLS 1, Case I. The sun sets at about 18:20. Watch
      your fuel; Texaco can give a little if you need it.
    script: "PADDLES talks the recovery when the flight reaches marshal."
    trigger:
      when: { player_in_zone: "MARSHAL" }
      message: "PADDLES: Ford, Paddles. Deck's clear, wind's down the angle, signal Charlie. Bring it home."
      seconds: 15

  - phase: "Debrief"
    time: "18:30"
    waypoints: []
    brief: "Debrief in Ready Room 2 with DARKSTAR's tapes."
    script: "BISHOP congratulates the flight only if the raid died before launch."
    trigger:
      when: { flag: 10, flag_false: 20 }
      message: "BISHOP: Ford, CAG. Not one missile in the air. Good hunting. Get aboard."
      seconds: 20
