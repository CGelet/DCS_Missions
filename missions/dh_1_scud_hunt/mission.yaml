variants:
  - name: "Which hide"
    options:
      - label: "The Lata road, lower Kodori"
        activate: ["TEL Lata", "Hide Guns Lata"]
      - label: "The hill road at Aimara"
        activate: ["TEL Aimara", "Hide Guns Aimara"]
      - label: "The Chkhalta road, upper valley"
        activate: ["TEL Chkhalta", "Hide Guns Chkhalta"]

storyboard:
  - phase: "Night Launch"
    time: "23:20"
    waypoints: ["INGURI"]
    brief: |
      Cold start at Senaki. North past the Inguri at 16,000 ft. Pods on, IR, white-hot. Every road with
      trees on it is a candidate.
    script: "The hide is rolled at mission start (see variants). 50%: an Osa covers the area."
    triggers:
      - when: { time_after: 10 }
        message: "ANVIL: Pontiac, Anvil. Kutaisi's still burning. Find it before it does that again."
        seconds: 15
      - when: { time_after: 5 }
        chance: 50
        activate: ["Hide Osa"]

  - phase: "The Search"
    time: "23:48"
    waypoints: ["SEARCH"]
    notes: "Ask the room how they'd split a 15 km circle between two pods without searching the same road twice."
    brief: |
      Split the circle: lead takes the roads west of the Kodori, wingman the hills east. Look for a long
      hot shape under the trees and a smaller one beside it. Call it before you shoot.
    script: "Capt. Lomidze calls with the radar's launch point when you reach SEARCH; it doesn't name the hide."
    trigger:
      when: { player_in_zone: "SEARCH" }
      message: "CAPT. LOMIDZE: Pontiac, Lomidze. Senaki's radar puts the launch point in the hills about ten kilometres north of Ochamchire. That's all we have. It's been an hour and a half."
      seconds: 25

  - phase: "Kill the Launcher"
    time: "23:55"
    waypoints: []
    brief: |
      When you find it, the launcher first. If it raises the missile, it's about to fire: shoot right
      then. Then the support vehicles.
    script: "TEL group 50% destroyed (the launcher plus one): success (flag 10)."
    trigger:
      when: { target_destroyed: true }
      set_flag: 10
      message: "OVERLORD: Pontiac, Overlord. Big secondary on your position. That's a fuel load going up. Good kill."
      seconds: 20

  - phase: "Home"
    time: "00:20"
    waypoints: ["OUTBOUND"]
    brief: |
      South and climbing, and an ILS to Senaki runway 09.
    script: "ANVIL's closing call."
    trigger:
      when: { player_in_zone: "OUTBOUND" }
      message: "ANVIL: Pontiac, Anvil. Copy outbound. Lomidze wants the pod tape. Every frame."
      seconds: 15
