  - name: "TEL Lata"
    coalition: red
    # Lower Kodori road at Lata, valley floor
    type: [Scud_B, Ural_375, Ural_375_PBU]
    lat: 43.0300
    lon: 41.4900
    heading: 60
    late_activation: true
  - name: "TEL Aimara"
