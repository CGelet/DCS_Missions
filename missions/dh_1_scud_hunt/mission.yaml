# DARK HORSE chapter 1: night Scud hunt. Source of truth; `python -m dcsmb build` renders hangar/dh_1_scud_hunt/.
#
# Story device: one of three. The launcher that fired at Kutaisi at 2200 is hiding at one of three
# road sites in the hills between Ochamchire and the upper Kodori (Lata, Aimara, Chkhalta road). The sim
# rolls which. There's no moon (new moon 2 June 2038). 50%: an Osa guards the hide. You get a rough
# launch point from the radar that saw the missile, and nothing else. Sites are on OSM roads.

meta:
  id: dh_1_scud_hunt
  title: "Operation DARK HORSE"
  subtitle: "Scud Hunt in the Dark"
  theater: caucasus
  role: "Armed recce"
  date: 2038-06-02
  start_time: "23:20"
  weather:
    temperature_c: 16
    wind_from_deg: 70
    wind_kts: 5
    clouds: "Clear, no moon"
    visibility: "20 km"
    qnh_inhg: 29.97
  blue_country: USA
  red_country: Russia

narrative:
  operation: "DARK HORSE"
  backstory: |
    At 2204 a missile came down on the edge of Kutaisi airfield. It missed the runway by 400 metres and
    took out a fuel farm. Georgian radar at Senaki tracked it all the way: a ballistic missile, a Scud,
    launched from the hills north of Ochamchire. By the time anyone looked, the launcher had gone.

    Scuds don't stay where they fire. They shoot, drive to a hide, and wait for the next order. The hide
    sites are on the mountain roads, under the trees, and they move at night. The detachment moved its
    Hornets to Senaki two hours ago. Pontiac flight is going to look.
  characters:
    - name: "CDR Kofi \"ANVIL\" Mensah"
      role: "Detachment commander, now at Senaki-Kolkhi"
    - name: "Capt. Tamar Lomidze"
      role: "Georgian Air Force intelligence liaison"
    - name: "OVERLORD"
      role: "E-3 AWACS"
    - name: "Pontiac 1-1 / 1-2"
      role: "You and your wingman, F/A-18C Hornets"
  hook: |
    "It fired once. It'll fire again before dawn unless someone finds it first. It's a truck in a
    forest at night. Find the truck." ANVIL, 2300 brief
  outcomes:
    success: |
      The launcher burns under the trees on the hill road, its missile still on the rail. There's no
      second launch at Kutaisi tonight. Capt. Lomidze has a new question: how many more are there?
    partial: |
      Pontiac finds the hide but only the support truck burns. The launcher gets away in the dark. It
      doesn't fire again tonight, but it will.
    failure: |
      At 0340 a second Scud comes down on Kutaisi, this time on the runway. The detachment's last
      Hornets there are trapped until the engineers fill the hole.

situation: |
  A Scud launcher fired at Kutaisi at 2204 from the hills north of Ochamchire, then disappeared. It is
  probably in a hide on one of the mountain roads between Ochamchire and the upper Kodori, within about
  15 km of the launch point. No moon tonight. Expect point defence at the hide: guns, maybe a short-range
  SAM. Gudauta's fighters have not flown at night so far.

objectives:
  primary: "Find and destroy the Scud launcher before it fires again."
  secondary: "Destroy its support vehicles at the hide."
  tertiary: "Recover both aircraft to Senaki-Kolkhi."

roe: |
  Weapons free on military vehicles in the hills north of Ochamchire. Positive identification on the
  ATFLIR before every release: there are villages along these roads, and their trucks drive at night too.

threats:
  - name: "The launcher's hide"
    kind: armor
    intel: suspected
    lat: 43.0300
    lon: 41.5800
    area_km: 15
    range_km: 0
    notes: "A Scud TEL with a support truck and a command vehicle, under trees on a road. Somewhere in this circle."
  - name: "Hide point defence"
    kind: sam
    intel: possible
    lat: 43.0300
    lon: 41.5800
    area_km: 15
    range_km: 10
    notes: "Missile brigades guard their launchers. Assume guns; there may be an Osa."

comms:
  # F/A-18C: radio 1 = COMM1, radio 2 = COMM2. Radio 1 channel 1 is always the flight frequency.
  - { name: "Pontiac (inter-flight)", freq: "255.000 AM", radio: 1, channel: 1 }
  - { name: "OVERLORD (AWACS)", freq: "251.000 AM", radio: 1, channel: 2, notes: "Answers the F5 AWACS menu" }
  - { name: "Senaki Tower", freq: "132.000 AM", radio: 2, channel: 1, notes: "TACAN 31X, ILS 09 108.90" }
  - { name: "ANVIL, Capt. Lomidze", freq: "255.000 AM", notes: "Scripted calls (on-screen text); they don't answer the radio menu" }

flights:
  - callsign: "Pontiac 1"
    aircraft: FA_18C_hornet
    count: 2
    player: true
    base: Senaki-Kolkhi
    start: cold
    radio1_mhz: 255.0
    laser_codes: [1688]
    loadout:
      1: AIM_9X_Sidewinder_IR_AAM
      2: LAU_117_AGM_65F
      3: BRU_33_with_2_x_GBU_12___500lb_Laser_Guided_Bomb
      4: AN_ASQ_228_ATFLIR___Targeting_Pod
      5: FPU_8A_Fuel_Tank_330_gallons
      6: AIM_120C_5_AMRAAM___Active_Rdr_AAM
      7: BRU_33_with_2_x_GBU_12___500lb_Laser_Guided_Bomb
      8: LAU_117_AGM_65F
      9: AIM_9X_Sidewinder_IR_AAM
    loadout_summary: "4× GBU-12, 2× AGM-65F Maverick, 2× AIM-9X, 1× AIM-120C, ATFLIR, 1× 330 gal tank"
    bingo_lbs: 4000
    joker_lbs: 6000
    waypoints:
      - { name: "INGURI",  lat: 42.5500, lon: 41.9500, alt_ft: 16000, kts: 400, eta: "23:42", zone_km: 5 }
      - { name: "SEARCH",  lat: 43.0300, lon: 41.5800, alt_ft: 16000, kts: 330, eta: "23:48", action: cas, zone_km: 15 }
      - { name: "OUTBOUND", lat: 42.6000, lon: 41.9000, alt_ft: 20000, kts: 420, eta: "00:20", zone_km: 5 }
    land: Senaki-Kolkhi

target:
  name: "The Scud launcher"
  lat: 43.0300
  lon: 41.5800
  area_km: 15
  groups: ["TEL Lata", "TEL Aimara", "TEL Chkhalta"]
  kill_pct: 50
  description: "A MAZ-543 transporter-erector-launcher with its missile, a support truck and a command vehicle, hidden under trees beside a mountain road."
  dmpi: "The launcher first, the long eight-wheeler. A GBU-12 on the TEL, a Maverick on the support truck."

units:
