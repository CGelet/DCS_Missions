target:
  name: "Target group: three trucks and a Shilka hulk"
  lat: 37.7000
  lon: -116.2000
  groups: ["Valley Target"]
  description: "Three trucks and a Shilka hulk parked in a line on the valley floor at the north end of Kawich Valley."
  dmpi: "The middle of the line. Lead's four Mk-82s across the trucks, wingman's four 30 seconds later on what's left."

zones:
  - { name: "VALLEY", lat: 37.5600, lon: -116.2100, radius_km: 16 }
  - { name: "SA-8 COVER", lat: 37.6000, lon: -116.0000, radius_km: 12 }

