      - { name: "VALLEY N", lat: 37.5500, lon: -116.2100, alt_ft: 500,   kts: 480, eta: "10:53", agl: true, zone_km: 3 }
      - { name: "POP",      lat: 37.6200, lon: -116.2000, alt_ft: 500,   kts: 480, eta: "10:54", agl: true, zone_km: 3 }
      - { name: "TGT",      lat: 37.7000, lon: -116.2000, alt_ft: 10000, kts: 450, eta: "10:55", action: bomb, zone_km: 3 }
