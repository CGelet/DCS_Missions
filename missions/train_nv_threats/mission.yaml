storyboard:
  - phase: "Start and Transit"
    time: "10:20"
    waypoints: ["WEST"]
    brief: |
      Cold start at Nellis, two-ship. Depart northwest and climb to 18,000 ft for WEST, staying south of
      R-4808N. Set the radar altimeter to 400 ft before the descent.
    script: "WREN checks in; the emitters are on from the start."
    trigger:
      when: { time_after: 10 }
      message: "WREN: Ford, Wren, at Blackjack. Both emitters are up and radiating. Show me the valley floor."
      seconds: 15

  - phase: "Into the Valley"
    time: "10:49"
    waypoints: ["DROP", "VALLEY S", "VALLEY N"]
    notes: "Ask the wingman how far behind lead they were at VALLEY N, and how they knew."
    brief: |
      Descend at DROP to 1,000 ft AGL, then 500 ft AGL at VALLEY S. North up the valley at 480 kt, lead
      on the west side, wingman a mile in trail. Stay under 6,500 ft MSL. Watch the RWR.
    script: |
      Entering VALLEY sets flag 50. Above 7,000 ft MSL in VALLEY before POP (flag 40): SA-6 valid shot (flag 31).
      Above 7,000 ft MSL in SA-8 COVER before POP: SA-8 valid shot (flag 32). Below 200 ft AGL: abort call (flag 23).
    triggers:
      - when: { player_in_zone: "VALLEY" }
        set_flag: 50
        message: "BLACKJACK: Ford, Blackjack. Kawich is hot, emitters active. Valid shots will be called."
        seconds: 15
      - when: { player_in_zone: "VALLEY", player_above_ft: 7000, flag_false: 40 }
        set_flag: 31
        message: "BLACKJACK: Ford one, Blackjack. SA-6, valid shot, valid shot. Get back down."
        seconds: 15
      - when: { player_in_zone: "SA-8 COVER", player_above_ft: 7000, flag_false: 40 }
        set_flag: 32
        message: "BLACKJACK: Ford one, Blackjack. SA-8, valid shot, east side. Get back down."
        seconds: 15
      - when: { player_below_agl_ft: 200, flag: 50, flag_false: 10 }
        set_flag: 23
        message: "BLACKJACK: Ford one, altitude! Below range minimum. Climb to five hundred."
        seconds: 15

  - phase: "Pop-up Attack"
    time: "10:54"
    waypoints: ["POP", "TGT"]
    brief: |
      At POP, pull to 30° nose up, roll in at 4,000 ft AGL and put four Mk-82s across the target line in
      a 20° dive. Wingman follows 30 seconds behind on whatever's left.
    script: |
      POP sets flag 40 (emitters no longer called). Target destroyed with no valid shot: complete (flag 10).
      Target destroyed after a valid shot: partial (flag 20).
    triggers:
      - when: { player_in_zone: "POP" }
        set_flag: 40
        message: "BLACKJACK: Ford one, pop called. Emitters are out of the exercise. Cleared hot on the target line."
        seconds: 15
      - when: { target_destroyed: true, flag_false: [31, 32] }
        set_flag: 10
        message: "BLACKJACK: Target destroyed. No shots on the way in. Ford, clean run. Egress east."
        seconds: 20
      - when: { target_destroyed: true, flag: 31 }
        set_flag: 20
        message: "BLACKJACK: Target destroyed. Ford one, you took the SA-6 shot on the way in. Egress east."
        seconds: 20
      - when: { target_destroyed: true, flag: 32 }
        set_flag: 20
        message: "BLACKJACK: Target destroyed. Ford one, you took the SA-8 shot on the way in. Egress east."
        seconds: 20

  - phase: "Egress and Recovery"
    time: "10:57"
    waypoints: ["GAP", "CLIMB"]
    brief: |
      Back down below 1,000 ft AGL, east through the gap at GAP, then climb to 20,000 ft at CLIMB and
      recover to Nellis (TACAN 12X), staying north and east of R-4808N.
    script: "WREN's closing call at CLIMB."
    triggers:
      - when: { player_in_zone: "CLIMB", flag: 10 }
        message: "WREN: Ford, Wren. Not a spike all the way up. That's how we'll do it in Georgia."
        seconds: 15
      - when: { player_in_zone: "CLIMB", flag_false: 10 }
        message: "WREN: Ford, Wren. I've got your altitude trace. We'll go through it at the debrief."
        seconds: 15
