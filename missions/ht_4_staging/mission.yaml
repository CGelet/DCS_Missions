# HIGH TIDE chapter 4: strike the landing ships in Ochamchire harbour. Source of truth;
# `python -m dcsmb build` renders hangar/ht_4_staging/.
#
# Story device: come in the back door. The harbour expects attacks from the sea, so the route crosses
# the coast at Anaklia and runs north behind it at 1,000 ft AGL, past Zugdidi and Gali, then pops
# and attacks the harbour from inland. The sim rolls whether a Krivak frigate is alongside with the
# landing ships (adding SA-N-4 cover) or out at sea, and 50% that Gudauta's Su-27s come.
# Overland route over farmland east of the coast; harbour positions as in chapter 1.

meta:
  id: ht_4_staging
  title: "Operation HIGH TIDE"
  subtitle: "Ochamchire Back Door"
  theater: caucasus
  role: "Anti-ship"
  date: 2038-05-17
  start_time: "05:40"
  weather:
    temperature_c: 16
    wind_from_deg: 60
    wind_kts: 6
    clouds: "Clear"
    visibility: "20 km, haze at sunrise"
    qnh_inhg: 30.03
  blue_country: USA
  red_country: Russia

narrative:
  operation: "HIGH TIDE"
  backstory: |
    With the SA-10 blind, Ochamchire is reachable. PRISM's latest picture shows three landing ships
    alongside the quay now, loading vehicles day and night. Fishing boats report the harbour's guns
    and SAMs all point out to sea, because that's where everything has come from so far.

    So Springfield won't come from the sea. MERLIN's plan crosses the coast at Anaklia in Georgian
    territory and runs north behind the coast, low, to come at the harbour from the hills. It's
    forty kilometres of flying low over somebody else's farmland.
  characters:
    - name: "CAPT Lena \"MERLIN\" Ostrowski"
      role: "CAG, aboard the Stennis"
    - name: "LCDR Sam \"PRISM\" Haddad"
      role: "Strike group intelligence officer"
    - name: "DARKSTAR"
      role: "E-2C Hawkeye"
    - name: "Springfield 1-1 / 1-2"
      role: "You and your wingman, F/A-18C Hornets"
  hook: |
    "Their guns face the water. So we don't come from the water." MERLIN, strike brief
  outcomes:
    success: |
      Two landing ships burn alongside the quay, and the third is holed and listing. The landing force
      has lost half its lift in five minutes. Whatever's left will have to sail soon or not at all.
    partial: |
      One landing ship is hit, but the others pull off the quay and anchor offshore. The landing will
      go ahead, smaller.
    failure: |
      The landing ships are untouched. Ochamchire keeps loading, and PRISM puts the landing date at
      three days away.

situation: |
  Three Ropucha-class landing ships are alongside the quay at Ochamchire, loading vehicles. The SA-10
  is blind, but the Osa at the quay is still there, and the harbour may have a frigate in it. Cross
  the coast at Anaklia, run north at 1,000 ft AGL behind the coast past Zugdidi and Gali, pop at POP,
  and attack the harbour from the east. Gudauta has Su-27s on alert.

objectives:
  primary: "Sink or disable the landing ships at the Ochamchire quay."
  secondary: "Destroy the quay's air defence on the way in."
  tertiary: "Recover both aircraft aboard the Stennis."

roe: |
  Weapons free on military vessels and air defence at Ochamchire harbour. Nothing in Ochamchire town
  beyond the quay. Weapons tight over Zugdidi and Gali on the way in.

threats:
  - name: "Quay Osa"
    kind: sam
    intel: confirmed
    lat: 42.7180
    lon: 41.4720
    range_km: 10
    notes: "Seen on the photo pass. Faces the sea."
  - name: "Frigate alongside"
    kind: sam
    intel: possible
    lat: 42.7080
    lon: 41.4500
    area_km: 5
    range_km: 15
    notes: "A Krivak was seen off Ochamchire twice this week. If it's alongside, SA-N-4 covers the harbour."
  - name: "Su-27s (Gudauta)"
    kind: air
    intel: possible
    lat: 43.1143
    lon: 40.5697
    range_km: 0
    notes: "Alert pair. DARKSTAR will call them."

comms:
  # F/A-18C: radio 1 = COMM1, radio 2 = COMM2. Radio 1 channel 1 is always the flight frequency.
  - { name: "Springfield (inter-flight)", freq: "256.000 AM", radio: 1, channel: 1 }
  - { name: "DARKSTAR (E-2C)", freq: "251.000 AM", radio: 1, channel: 2, notes: "Answers the F5 AWACS menu" }
  - { name: "TEXACO 1 (S-3B)", freq: "253.000 AM", radio: 1, channel: 3, notes: "TACAN 60Y" }
  - { name: "Mother (Stennis)", freq: "127.500 AM", radio: 2, channel: 1, notes: "TACAN 74X, ICLS 1. Answers the ATC menu" }
  - { name: "MERLIN, PRISM", freq: "256.000 AM", notes: "Scripted calls (on-screen text); they don't answer the radio menu" }

