variants:
  - name: "Where the frigate is"
    options:
      - label: "Alongside the landing ships"
        activate: ["Krivak Alongside"]
        when: { time_after: 5 }
      - label: "At sea, northwest of the harbour"
        activate: ["Krivak at Sea"]
        when: { time_after: 5 }

storyboard:
  - phase: "Launch"
    time: "05:40"
    waypoints: []
    brief: |
      Cold start on the Stennis at sunrise. Launch, and descend to 1,000 ft AGL before the Anaklia
      coast. Laser code 1688.
    script: "MERLIN checks in. The frigate's position is rolled at start."
    trigger:
      when: { time_after: 10 }
      message: "MERLIN: Springfield, Merlin. Back door's open. Keep it low over the farms."
      seconds: 15

  - phase: "Behind the Coast"
    time: "06:00"
    waypoints: ["ANAKLIA", "ZUGDIDI", "GALI"]
    brief: |
      Coast in at Anaklia, northeast to Zugdidi, then northwest past Gali at 1,000 ft AGL and 450 kt.
      Weapons tight over the towns. Nothing at the harbour can see you yet.
    script: "50%: Gudauta's Su-27s launch as you pass Gali."
    trigger:
      when: { player_in_zone: "GALI" }
      chance: 50
      activate: ["Gudauta Flankers"]
      message: "DARKSTAR: Springfield, Darkstar. Two contacts departing Gudauta, heading southeast, angels one-five and climbing. Hostile."
      seconds: 20

  - phase: "Pop and Attack"
    time: "06:06"
    waypoints: ["POP", "QUAY"]
    notes: "Ask the room: there's a frigate alongside after all. What changes in the attack?"
    brief: |
      Pop to 8,000 ft at POP and roll in on the quay from the east, out of the sunrise. Maverick on
      the Osa first if it's up, then the bombs on the ships. Off target to the west, over the water.
    script: "Landing squadron 67% destroyed: success (flag 10)."
    trigger:
      when: { target_destroyed: true }
      set_flag: 10
      message: "PRISM: Springfield, Prism. Darkstar sees big secondaries at the quay. Two ships burning. That's the landing force's lift."
      seconds: 20

  - phase: "Home"
    time: "06:11"
    waypoints: ["SEAWARD"]
    brief: |
      Out over the water to the southwest, climbing, and recover aboard the Stennis.
    script: "MERLIN's closing call."
    trigger:
      when: { player_in_zone: "SEAWARD" }
      message: "MERLIN: Springfield, Merlin. Feet wet, good. Come home."
      seconds: 15
